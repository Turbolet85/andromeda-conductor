[[lift]]
target = "## Secret Management"
after = "**Secret scanning in CI:**"
text = """**Secret-scan gate shape:** the gate is the `conductor-core` test target `crates/conductor-core/tests/secret_scan_gate.rs`, built on `regex` — a `conductor-core` dev-dependency edge on an already-locked package, so the gate admits no new package. The `rust` job's `Secret-scan gate` step is only its presence-guarded invocation (it fails when git lists no tracked files, so the gate never passes over an empty subject), and `agent-run run`'s workspace nextest runs the same target locally. The gate carries in-suite negative arms that prove it can fail — every rule fires on a runtime-built sample. Its accepted trade-off is a small rule set Conductor maintains itself, with no entropy scoring; the alternative, a job-time-fetched scanner (a marketplace action or a downloaded binary), stays rejected because it would add a second member to the third dependency class (§Dependency Security) and a second CI non-loopback egress."""
