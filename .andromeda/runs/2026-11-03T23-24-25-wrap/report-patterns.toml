[[pattern]]
id = 'arch-reg'
regex = 'arch-registry-check(\.py)?|arch-registry|D-arch-registry-size|det-i5onq3b3|registry-size|size gate'
ignore_case = true

[[pattern]]
id = 'arch-md'
regex = 'architecture\.md|architecture-amendments\.md'
ignore_case = true

[[pattern]]
id = 'tokio-bump'
regex = 'tokio 1\.52\.3|1\.54\.1|RUSTSEC-2026-0386'
ignore_case = true

[[pattern]]
id = 'size-guide'
regex = 'free bytes|Read cap|38 ?115|within target'
ignore_case = true

[[pattern]]
id = 'product-row'
regex = 'product row|db/moved'
ignore_case = true

[[pattern]]
id = 'owner-title'
fixed = 'Architecture-registry check retired'
ignore_case = true

[[pattern]]
id = 'owner-generic'
regex = 'owned by a (route entry|CARRY)'
ignore_case = true
