name: CI

on:
  push:
  pull_request:
  # workflow_dispatch:  # reserved for the future live-Pulse / operator gate (Epoch 10)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gate (build · test · lint · supply-chain · coverage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pin + components come from rust-toolchain.toml (channel 1.95.0 >= MSRV 1.94.1;
      # clippy + llvm-tools-preview). rustup auto-installs it on first use.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      # Placed here, ahead of the cache restore and the build, because rustfmt needs only the toolchain
      # the preceding step installs — no cache, no node, no bundle, no compile. A formatting violation is
      # reported in seconds instead of after the ~18 min build+test path. --all, not the bare form: the
      # workspace declares no default-members, so the two are equivalent today and would diverge the
      # moment one is added. test-plan §9 Lint row; §9/§10 make a fmt failure a build-FAILURE condition.
      - name: Formatting gate (cargo fmt)
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binaries (not cargo-install-from-source) keep the Windows runner fast.
      - name: Install cargo subcommands
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,cargo-llvm-cov

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      # conductor-tauri's generate_context! resolves build.frontendDist (ui/dist) at compile time, so
      # the webview bundle must exist before the workspace build compiles conductor-tauri (Epoch 9).
      - name: Build frontend bundle (ui/dist)
        working-directory: crates/conductor-tauri/ui
        run: |
          npm ci
          npm run build

      # --locked enforces the committed, un-drifted Cargo.lock (security-plan §Dependency Security).
      - name: Build (locked)
        run: cargo build --workspace --locked

      # Flakiness budget — assert the determinism invariant at the CI level, not the local file alone:
      # any non-zero `retries` (count or backoff-map) in the nextest config fails the gate
      # (test-plan §10 zero-flakiness; arch §Cross-cutting Patterns determinism discipline).
      - name: Flakiness budget (assert zero-retry)
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*retries[[:space:]]*=[[:space:]]*([1-9]|\{)' .config/nextest.toml; then
            echo "::error file=.config/nextest.toml::non-zero retries configured — the zero-flakiness budget forbids retries (test-plan §10)"
            exit 1
          fi

      # Secret-scan gate (security-plan §Secret Management — the no-secrets invariant held over time). The subject
      # is the workspace as git lists it; the Rust test IS the gate, with its rule set, its allowlist and the
      # negative arms that prove it can fail, so the step is only its presence-guarded invocation. A hit names
      # path:line and the rule, never the matched text.
      - name: Secret-scan gate
        shell: bash
        run: |
          test -n "$(git ls-files)" || { echo "::error::no tracked files — the secret-scan gate has no subject"; exit 1; }
          cargo nextest run -p conductor-core --test secret_scan_gate --profile ci

      # The Workflow env-context gate below ADMITS a key a step writes to GITHUB_ENV, and GitHub's docs do not say
      # whether such a key resolves through the env expression context. This pair measures it on every run: the
      # assert reads the EXPRESSION form (substituted before the shell starts), never the shell variable, so a
      # context that drops GITHUB_ENV keys fails here instead of silently widening the gate below.
      - name: GITHUB_ENV context probe (write)
        shell: bash
        run: echo "GHA_ENV_CONTEXT_PROBE=written-by-an-earlier-step" >> "$GITHUB_ENV"

      - name: GITHUB_ENV context probe (assert)
        shell: bash
        run: |
          if [ "${{ env.GHA_ENV_CONTEXT_PROBE }}" != "written-by-an-earlier-step" ]; then
            echo "::error::a GITHUB_ENV key did not resolve through the env expression context — the Workflow env-context gate's admission of GITHUB_ENV keys is unfounded"
            exit 1
          fi
          echo "GITHUB_ENV context probe: the env expression context carries a GITHUB_ENV key"

      # Workflow env-context gate: an ${{ env.X }} expression or a bare `if: env.X` naming a key no workflow, job
      # or step declares resolves empty WITHOUT error — the trap the EDGEWEBDRIVER comment in the a11y job records.
      # The gate is the Rust test over every workflow file; a hit names the file, line and key.
      - name: Workflow env-context gate
        shell: bash
        run: |
          ls .github/workflows/*.yml >/dev/null 2>&1 || { echo "::error::no workflow file — the env-context gate has no subject"; exit 1; }
          cargo nextest run -p conductor-core --test workflow_env_gate --profile ci

      # Dogfood the source-of-truth release gate: agent-run `run` = nextest --profile ci (zero-retry,
      # emits target/nextest/ci/junit.xml) + test --doc + clippy -D warnings. Setting
      # $PSNativeCommandUseErrorActionPreference makes the script fail-fast on the first native
      # non-zero exit regardless of the pwsh default (mirrors the .sh `set -e`).
      - name: Test + lint (dogfood agent-run)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\scripts\agent-run.ps1 run

      # Coverage-completeness gate (test-plan §1 Critical Path 6 — the definition-of-done gate).
      # The subject is the COMMITTED coverage-matrix.md; the gate byte-compares it to the production
      # renderer, so a classification change that skipped regeneration fails here rather than
      # shipping a stale artifact. Re-listing the classification in jq would be a second copy that
      # drifts from `coverage_matrix()`, so the gate is the Rust test.
      - name: Coverage-completeness gate
        shell: bash
        run: |
          test -f coverage-matrix.md || { echo "::error::coverage-matrix.md is absent — the gate has no subject"; exit 1; }
          cargo nextest run -p conductor-report --test coverage_gate --profile ci
          echo "coverage completeness: PASS ($(grep -cE '^\| `P-' coverage-matrix.md) capabilities classified)"

      # Scenario-assertion audit gate (test-plan §6 — the mechanical form of the two corpus
      # properties 0.3.0 Epoch 2 established by hand). The subject is the COMMITTED audit ledger,
      # graded against the catalog as loaded in both directions on both axes, so a new live
      # assertion, a new over-tier scenario, or a pin that stopped describing the catalog fails here
      # rather than being noticed the next time someone looks.
      - name: Scenario-assertion audit gate
        shell: bash
        run: |
          test -f contracts/scenario-audit-ledger.toml || { echo "::error::contracts/scenario-audit-ledger.toml is absent — the gate has no subject"; exit 1; }
          cargo nextest run -p conductor-core --test scenario_audit_gate --profile ci

      - name: Supply-chain — cargo audit
        run: cargo audit

      - name: Supply-chain — cargo deny
        run: cargo deny check

      # Coverage gate (Epoch 10): instrumented re-run → LCOV + Cobertura reports → the binding
      # line-coverage floor. test-plan §10: Minimal tier line >= 60% (--fail-under-lines 60),
      # excluding integration-test / fixture / stub code under crates/*/tests/. The workspace has no
      # in-tree OTLP codegen — opentelemetry-proto is an external crate llvm-cov already excludes.
      - name: Coverage (collect instrumented)
        run: cargo llvm-cov nextest --workspace --profile ci --no-report

      - name: Coverage (LCOV + Cobertura reports)
        shell: bash
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '[\\/]tests[\\/]'
          cargo llvm-cov report --cobertura --output-path coverage.xml --ignore-filename-regex '[\\/]tests[\\/]'

      - name: Coverage (line-floor gate — test-plan §10, >= 60%)
        run: cargo llvm-cov report --fail-under-lines 60 --ignore-filename-regex '[\\/]tests[\\/]'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.xml

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/nextest/ci/junit.xml

      # Obs CI conformance gate (Epoch 10 — obs-plan §9/§10). Produce Conductor's OWN self-observation
      # artifact in CI, assert it conforms to the self-obs base schema + the redaction boundary + zero
      # unlogged panics, then upload it. CI-config only — the obs sink it asserts is unchanged.
      # ANDROMEDA_PULSE_DATA_DIR carries an injection metacharacter → conductor-verify rejects it BEFORE any
      # sidecar spawn → a Blocked envelope (exit 0); init_observability still writes every self-obs line to
      # logs/agent-latest.jsonl (the hermetic no-live-Pulse lever; cli_smoke.rs precedent). No Pulse needed.
      - name: Obs conformance — produce agent-latest.jsonl (no-Pulse Blocked run)
        shell: bash
        env:
          ANDROMEDA_PULSE_DATA_DIR: 'pulse;injection'
        run: |
          mkdir -p logs
          # Capture stderr too: an UNSTRUCTURED panic (a bypassed set_hook) lands on stderr, not the JSON
          # file sink, so the zero-unlogged-panics gate greps both (obs-plan §9).
          cargo run -q -p conductor-cli --bin conductor -- run error-baseline-spike --seed 424242 --agent-mode 2> logs/producer-stderr.log

      # Assert the self-obs BASE-line schema (obs-plan §3 "two record shapes" — NOT the run-report envelope,
      # which lives in runs/<run_id>.jsonl), the redaction boundary (no absolute host path; anchors mirror
      # conductor-core::redact::is_host_path_token — `::` module paths are NOT flagged), and zero unlogged
      # panics (obs-plan §10). shell: bash for fail-fast multi-command (mirrors the flakiness-budget gate).
      - name: Obs conformance + zero-unlogged-panics gate
        shell: bash
        run: |
          log=logs/agent-latest.jsonl
          test -s "$log" || { echo "::error file=$log::self-obs artifact missing or empty"; exit 1; }
          # (a) every line carries the 7 required self-obs base fields (obs-plan §3/§6)
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '%s' "$line" | jq -e '.timestamp_ms and .level and .target and .["service.name"] and .["service.version"] and .["deployment.environment"] and .run_id' >/dev/null \
              || { echo "::error file=$log::self-obs line missing a required base field"; exit 1; }
          done < "$log"
          # (b) redaction boundary — no absolute host path leaked (anchors mirror conductor-core::redact)
          if grep -nE '([A-Za-z]:[\\/]|/home/|/Users/|\\Users\\|/root/|%APPDATA%|%USERPROFILE%|%LOCALAPPDATA%|\$HOME|~/|\.cargo[\\/]|\.rustup[\\/])' "$log"; then
            echo "::error file=$log::absolute host path leaked into the self-obs artifact (redaction boundary)"; exit 1
          fi
          # (c) zero unlogged panics — grep the JSON sink AND the captured producer stderr (obs-plan §9):
          # an unstructured backtrace (bypassed set_hook) lands on stderr, not the file. Only a structured
          # tracing::error!(panic=…) JSON line is acceptable (obs-plan §10).
          if grep -nE '^thread.*panicked' "$log" logs/producer-stderr.log; then
            echo "::error::unstructured panic backtrace found (zero-unlogged-panics gate)"; exit 1
          fi
          echo "obs conformance + zero-unlogged-panics: PASS ($(wc -l < "$log") lines checked)"

      # Run-report envelope conformance gate (obs-plan §9/§10 — the envelope's own gate, reserved
      # there as not-yet-built). The producer above ALSO wrote runs/<run_id>.jsonl, which nothing
      # asserted until now. The gate is the RUST test, pointed at that journal: re-listing the
      # eleven envelope / nine CheckRecord key names in jq would be a third copy of the schema
      # (the structs · obs-plan §3/§6 · this file) and would drift from the first two.
      - name: Run-journal conformance gate
        shell: bash
        env:
          CONDUCTOR_RUNS_DIR: runs
        run: |
          ls runs/*.jsonl >/dev/null 2>&1 || { echo "::error::the producer wrote no run journal to assert over"; exit 1; }
          cargo nextest run -p conductor-run --test journal_conformance --profile ci
          echo "run-journal conformance: PASS ($(ls runs/*.jsonl | wc -l) journals checked)"

      - name: Upload obs self-observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-conformance
          path: logs/agent-latest.jsonl

  frontend:
    name: Frontend gate (npm audit · build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/conductor-tauri/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      - name: Install (clean)
        run: npm ci

      # 0 PRODUCTION vulnerabilities required; dev-only test-tooling advisories accepted at
      # dev-tree grain (security-plan §Dependency Security / Frontend npm — the npm analogue of
      # the deny.toml accepted-exceptions mechanism; the a11y harness never ships).
      - name: Supply-chain — npm audit (production deps)
        run: npm audit --omit=dev

      - name: Build (tsc --noEmit && vite build)
        run: npm run build

  # The a11y gate (a11y-plan §3 a11y-ci-gate-wire / violation-json-emission-wire; §9 CI Integration).
  # The ROUTINE arm only: it needs no live Pulse (it seeds its own committed fixture through the
  # production writer), while the driven and sr* suites do and are barred from CI by test-plan §11 and
  # architecture §Established Decisions [CI/CD].
  a11y:
    name: A11y gate (routine arm · axe · contrast · violation JSON)
    # Pinned to the EXPLICIT label rather than windows-latest: this job drives a WebView2 session, and a
    # silent -latest move could change the runtime out from under the gate.
    #
    # MOVED 2026-09-17 on an operator ruling, from windows-2025. Measured basis: at run 35192876641 this
    # image, at a coherent 131.0.2903.86 driver+runtime pair, created the first hosted-runner WebView2
    # session in this project's history and ran the routine arm 11 passing / 1 failing / 2 skipped, the one
    # red being an assertion defect since fixed. windows-2025 never created a session at runtime 152 or 153,
    # and actions/runner-images#14738 reports the same failure for a plain Tauri/wry app on that image.
    # The pair's COHERENCE is the measured subject — not a runtime floor, which is falsified on its own
    # terms: not necessary (131/131 works), not sufficient (152/152 fails, run 34654076633) and destructive
    # (run 35185153012 fetched 153 over a native 131). Coherence here is PRODUCED by the driver pin below:
    # this image ships a floating driver over a native 131 runtime — 151.0.4129.107 at run 35186499514,
    # 152.0.4191.77 at run 35185153012 — so unpinned it is incoherent, and by a different amount each run.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # cargo-nextest runs the conformance gate below; tauri-driver is an npm package resolved from
      # node_modules by wdio.conf.ts, so it needs no cargo install.
      - name: Install cargo subcommands
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      # msedgedriver refuses a session outright when its major differs from the runtime's ("This version of
      # Microsoft Edge WebDriver only supports Microsoft Edge version N"), so the pair must COHERE. On this
      # image it does not: a floating driver sits over a native 131 runtime — 151.0.4129.107 at run
      # 35186499514, 152.0.4191.77 at run 35185153012 — so the coherence is MADE here, not asserted.
      #
      # The runtime already on the image chooses the driver: the version is DERIVED, never authored, so the
      # pin cannot drift on its own. That is exactly the property the Evergreen bootstrapper this step
      # replaces could not have — its fwlink carries no version selector, so every job took whatever was
      # latest, which is how a 153 runtime landed under a 152 driver (run 35185153012) and destroyed a
      # working configuration. Retiring that fetch and adding this one leaves the non-loopback egress count
      # at ONE (2026-09-17 operator ratification; arch §Occupied Resources — Ports).
      #
      # Registry keys are READ through the PowerShell provider form and REPORTED in the colon-free reg.exe
      # form: the project's host-path hygiene anchor matches letter+colon+slash, which `HKLM:\` satisfies
      # while being no host path at all.
      - name: Pin msedgedriver to the image's WebView2 runtime (gate)
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtime = $keys | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
                     Where-Object { $_ } | Select-Object -First 1
          if (-not $runtime) {
            Write-Output '[precondition] WEBVIEW2_RUNTIME_VERSION: no EdgeUpdate client key under HKLM\SOFTWARE\Microsoft\EdgeUpdate\Clients'
            exit 1
          }
          Write-Output "[diag] WebView2 Evergreen Runtime in effect: $runtime"

          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$runtime/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            Write-Output '[precondition] MSEDGEDRIVER_PIN: archive carried no msedgedriver.exe'
            exit 1
          }

          # Terminal gate, evaluated BEFORE the binary is executed: a signature check that warns and proceeds
          # is the silent-downgrade shape security-plan bans. Handle NAME + state only, never the path. Kept
          # verbatim from the Evergreen bootstrapper's gate — the driver is another non-repo-derived binary
          # arriving from the network at job time, so it inherits the same admitting control unchanged.
          $sig = Get-AuthenticodeSignature -LiteralPath $driver
          if ($sig.Status -ne 'Valid') {
            Write-Output "[precondition] MSEDGEDRIVER_SIGNATURE: NOT VALID ($($sig.Status))"
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            Write-Output '[precondition] MSEDGEDRIVER_SIGNATURE: VALID BUT UNEXPECTED SIGNER'
            exit 1
          }
          Write-Output '[precondition] MSEDGEDRIVER_SIGNATURE: valid, Microsoft Corporation'

          $driverVersion = (Get-Item $driver).VersionInfo.ProductVersion
          Write-Output "[diag] msedgedriver: $driverVersion"
          $runtimeMajor = [int]($runtime.Split('.')[0])
          $driverMajor = [int]($driverVersion.Split('.')[0])
          if ($driverMajor -ne $runtimeMajor) {
            Write-Output "[precondition] MSEDGEDRIVER_COHERENCE: driver major $driverMajor against runtime major $runtimeMajor"
            exit 1
          }
          Write-Output "[precondition] MSEDGEDRIVER_COHERENCE: both major $runtimeMajor"

          # The asserting step resolves the driver from EDGEWEBDRIVER, so the pin is published through the
          # same handle the runner image would have set — no second reader, no new handle.
          Add-Content -Path $env:GITHUB_ENV -Value "EDGEWEBDRIVER=$dir"

      # The harness verb owns the ordering (ensure_frontend -> release build with
      # --features tauri/custom-protocol -> wdio run), so the job does not restate it.
      #
      # CONDUCTOR_A11Y_STRICT inverts the leg's skip-at-exit-0 guard: on a dev host an unresolved
      # handle SKIPS so an unconfigured machine is not read as a defect, but a gate that can pass by
      # skipping is banned (a11y-plan §11 Anti-Patterns -> CI). The guard itself is untouched.
      #
      # EDGEWEBDRIVER names the PINNED driver directory the gate above published through GITHUB_ENV — the
      # image's own driver floats and is incoherent with its runtime, so the image value is deliberately
      # overwritten rather than read. It stays a runner-PROCESS variable resolved in the step's SHELL: the
      # ${{ env.* }} expression context holds only what a workflow, job or step declared, and resolving it
      # there yielded an empty base — the handle reached the guard as the literal "\msedgedriver.exe" and
      # the strict arm correctly failed the gate (measured 2026-09-07, run 34148079506).
      #
      # No separate version diagnostic: the pin gate above prints the runtime and the driver and asserts
      # their coherence, so a second reading would be a copy that can drift from the gate's own
      # (architecture §Established Decisions [CI/CD] — the gate IS the assertion).

      - name: A11y routine arm (tauri-driver + axe + contrast)
        shell: pwsh
        env:
          CONDUCTOR_A11Y_STRICT: '1'
          CONDUCTOR_ENV: dev
        run: |
          if (-not $env:EDGEWEBDRIVER) {
            Write-Output '[precondition] EDGEWEBDRIVER: NOT SET by the runner image'
            exit 1
          }
          $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            Write-Output '[precondition] CONDUCTOR_MSEDGEDRIVER: NOT RESOLVED'
            exit 1
          }
          Write-Output '[precondition] CONDUCTOR_MSEDGEDRIVER: resolved'
          $env:CONDUCTOR_MSEDGEDRIVER = $driver
          # No $PSNativeCommandUseErrorActionPreference here. It makes the harness's non-zero a
          # TERMINATING error at its `npm run a11y` call, before agent-run.ps1 prints the captured wdio
          # output the gate's verdict is read from — the job log then carries one
          # NativeCommandExitException line and none of wdio's own (measured 2026-09-07). The harness
          # already reads $LASTEXITCODE from the bare command and exits with it, so the preference adds
          # no detection and only destroys the diagnostic.
          #
          # The leg runs at the step's NATIVE HIGH INTEGRITY, with no de-elevation. Measured and ruled
          # 2026-09-17: on windows-2022 at a coherent 131/131 pair both HIGH driver-alone cells created a
          # session (status 200, port AND pipe) while both MEDIUM cells failed with `chrome not reachable`
          # (run 35191569653), and the arm then ran at HIGH with no launcher — 11 passing / 1 failing /
          # 2 skipped (run 35192876641), the one red an assertion defect since fixed.
          #
          # Integrity's SIGN is CONFIGURATION-BOUND: the Medium drop helped at runtime 153 on the dev host
          # and BREAKS the session here. The 2026-09-16 legs are bounded by that configuration, never
          # retired — on a runtime-153 host the drop would still be the thing that works.
          #
          # scripts/a11y-limited-token-launch.ps1 stays in the tree and keeps its registration as a governed
          # spawn form: the driver-alone diagnostics below still launch through it to hold the instrument
          # fixed while varying integrity. Only the ASSERTING step stopped using it.
          #
          # The witness stays the leg's ENTRY POINT. It is not merely a token recorder — it starts the leg
          # with Start-Process -PassThru and no -Wait (a surviving grandchild holding an inherited stdout
          # handle pins the parent otherwise), reaps orphans in repeated passes with a settle, and refuses a
          # zero exit whose wdio log never appeared.
          & pwsh -NoProfile -File scripts/a11y-token-witness.ps1
          $legExit = $LASTEXITCODE

          # The witness records the token the leg ACTUALLY got — now this step's own High-integrity token,
          # which is the evidence that the leg ran undropped. Inheriting a label is no more self-evident
          # than setting one, so the reading is taken from inside the leg. It is read from the file as well
          # as the console so the reading survives whatever the child's console turns out to be.
          $witnessLog = Join-Path $PWD 'runs/a11y-token-witness.log'
          if (Test-Path -LiteralPath $witnessLog) {
            Write-Output '--- token witness, from inside the leg (runs/a11y-token-witness.log) ---'
            Get-Content -LiteralPath $witnessLog
          } else {
            Write-Output '[diag] A11Y_TOKEN_WITNESS: absent — the leg never reached its witness'
          }

          # Everything the leg does BEFORE wdio (frontend build, cargo build, the harness's own
          # preconditions) prints only to the leg's console, which the witness captures to a file. Without
          # printing it, a failure in that window is invisible — measured in run 35141676310, where the leg
          # never reached wdio and the job log carried no reason at all.
          # A blind tail is the wrong cut: the leg's stderr is dominated by cargo progress, so the last N
          # lines are compile noise and the driver's own startup window scrolls past (measured in run
          # 35143892765, where tauri-driver never answered on 4444 and the tail carried only Compiling
          # lines). Compile progress is dropped and the rest is kept whole.
          $legConsole = Join-Path $PWD 'runs/a11y-leg-console.log'
          foreach ($f in @($legConsole, "$legConsole".Replace('.log', '.err.log'))) {
            if (Test-Path -LiteralPath $f) {
              Write-Output "--- leg console ($(Split-Path -Leaf $f)), compile progress elided ---"
              Get-Content -LiteralPath $f |
                Where-Object { $_ -notmatch '^\s*(Compiling|Downloaded|Downloading|Finished|Fresh|Updating|Adding|Locking|dist/assets/)' } |
                Select-Object -Last 200
            }
          }

          # The harness's own captured wdio output is the leg's evidence channel. Printing it here keeps
          # the PRINTED verdict readable in the job log; the verdict itself decided inside the leg and
          # travels as the exit code.
          $a11yLog = Join-Path $PWD 'runs/a11y-e2e.log'
          if (Test-Path -LiteralPath $a11yLog) {
            Write-Output '--- captured wdio output (runs/a11y-e2e.log) ---'
            Get-Content -LiteralPath $a11yLog
          } else {
            Write-Output '[diag] A11Y_LEG_LOG: absent — the leg did not reach its wdio call'
          }
          exit $legExit

      # THE DISCRIMINATING VARIATION. The session-isolation step below runs its (b) driver-alone POST at
      # the job's own HIGH integrity and returns `DevToolsActivePort file doesn't exist`; the leg at
      # MEDIUM returns `from chrome not reachable` (measured, runs 35145664132 and 35147042449, against
      # three High controls carrying zero of that string). Those are different failures, but the two runs
      # differ in instrument as well as integrity — the leg goes through wdio and tauri-driver, (b) does
      # not. Running (b)'s own sequence INSIDE the medium-integrity launch holds the instrument and varies
      # only the label, which is what separates "the wdio/tauri-driver path produces that error" from "the
      # driver-to-browser step produces it under Medium". Diagnostic: it can never decide the gate.
      - name: WebView2 driver-alone at medium integrity (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CONDUCTOR_ENV: dev
        run: |
          if ($env:EDGEWEBDRIVER) { $env:CONDUCTOR_MSEDGEDRIVER = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe' }
          & .\scripts\a11y-limited-token-launch.ps1 `
            -Program (Get-Command pwsh).Source `
            -ArgumentList '-NoProfile','-File','scripts/a11y-token-witness.ps1','-Mode','driver-alone','-Transport','port','-LogTag','medium' `
            -WorkingDirectory $PWD.Path `
            -ForwardEnv 'CONDUCTOR_ENV','CONDUCTOR_MSEDGEDRIVER','EDGEWEBDRIVER' `
            -TimeoutSeconds 300
          $w = Join-Path $PWD 'runs/a11y-token-witness.log'
          if (Test-Path -LiteralPath $w) {
            Write-Output '--- driver-alone witness, from inside the medium-integrity launch ---'
            Get-Content -LiteralPath $w
          }

      # THE UNVARIED TRANSPORT. Every failure measured over six days belongs to the PORT transport and to
      # its two failure points — the DevToolsActivePort file (absent at High) and the loopback TCP connect
      # (refused at Medium). msedgedriver's own verbose log recommends the other one, in BOTH the High and
      # the Medium run: "Use the --remote-debugging-pipe Chrome switch instead of the default
      # --remote-debugging-port". A pipe bypasses both failure points and has never been exercised AS A
      # TRANSPORT: the pipe-route step below launches the app with the switch set and watches for a profile
      # directory and liveness, but never speaks over the pipe — and a profile appears in the bare-app
      # control too, so that observation is not pipe-specific. Run at BOTH labels, medium first, so the
      # reading is a transport comparison and not another single-condition probe.
      - name: WebView2 driver-alone over PIPE at medium integrity (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CONDUCTOR_ENV: dev
        run: |
          if ($env:EDGEWEBDRIVER) { $env:CONDUCTOR_MSEDGEDRIVER = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe' }
          & .\scripts\a11y-limited-token-launch.ps1 `
            -Program (Get-Command pwsh).Source `
            -ArgumentList '-NoProfile','-File','scripts/a11y-token-witness.ps1','-Mode','driver-alone','-Transport','pipe','-LogTag','medium' `
            -WorkingDirectory $PWD.Path `
            -ForwardEnv 'CONDUCTOR_ENV','CONDUCTOR_MSEDGEDRIVER','EDGEWEBDRIVER' `
            -TimeoutSeconds 300
          $w = Join-Path $PWD 'runs/a11y-token-witness.log'
          if (Test-Path -LiteralPath $w) {
            Write-Output '--- pipe transport, medium integrity ---'
            Get-Content -LiteralPath $w
          }

      # The HIGH control for the step above: same code, same capabilities, same transport, no launcher —
      # a hosted step is High by construction. Without it a pipe result at Medium could not be told from a
      # pipe result in general.
      - name: WebView2 driver-alone over PIPE at high integrity (control, diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CONDUCTOR_ENV: dev
        run: |
          if ($env:EDGEWEBDRIVER) { $env:CONDUCTOR_MSEDGEDRIVER = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe' }
          & (Get-Command pwsh).Source -NoProfile -File scripts/a11y-token-witness.ps1 -Mode driver-alone -Transport pipe -LogTag high
          $w = Join-Path $PWD 'runs/a11y-token-witness.log'
          if (Test-Path -LiteralPath $w) {
            Write-Output '--- pipe transport, high integrity (control) ---'
            Get-Content -LiteralPath $w
          }

      # Isolates `session not created: DevToolsActivePort file doesn't exist` — the WARN-level line the
      # driver retries on, which says msedgedriver launched the app and never found its DevTools port.
      # Runs AFTER the routine arm, not before: the arm's own step performs the release build, so there
      # is no binary to launch until it has run. `if: always()` + continue-on-error keep it a diagnostic
      # that can never decide the gate.
      - name: WebView2 session isolation (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CONDUCTOR_RUNS_DIR: runs/e2e-fixture
          CONDUCTOR_ENV: dev
        run: |
          $app = Join-Path $PWD 'target\release\conductor-tauri.exe'
          if (-not (Test-Path -LiteralPath $app)) { Write-Output '[diag] app binary: NOT BUILT'; exit 0 }
          Write-Output '[diag] app binary: present'

          # The driver builds its scoped profile under TEMP while (a) below uses RUNNER_TEMP; whether
          # those share a volume is a candidate discriminator, so it is recorded as a boolean.
          $tempRoot = [System.IO.Path]::GetPathRoot($env:TEMP)
          $runnerRoot = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          Write-Output "[diag] TEMP and RUNNER_TEMP share a volume: $($tempRoot -eq $runnerRoot)"

          # (a) bare-app control. On the dev host the loader honours WEBVIEW2_USER_DATA_FOLDER and writes
          # DevToolsActivePort under it in 1s. Polling (rather than one sleep) is what separates "the
          # runner's loader ignores the handle" from "it is merely slow" from "it never appears".
          $udf = Join-Path $env:RUNNER_TEMP 'wv2-control'
          New-Item -ItemType Directory -Force -Path $udf | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = $udf
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=0'
          $err = Join-Path $env:RUNNER_TEMP 'app.stderr.txt'
          $p = Start-Process -FilePath $app -WorkingDirectory $PWD -PassThru -RedirectStandardError $err
          $port = Join-Path $udf 'EBWebView\DevToolsActivePort'
          $seen = -1
          foreach ($s in 1..90) {
            Start-Sleep -Seconds 1
            if (Test-Path -LiteralPath $port) { $seen = $s; break }
          }
          $seenLabel = if ($seen -ge 0) { "${seen}s" } else { 'never within 90s' }
          Write-Output "[diag] (a) bare-app DevToolsActivePort first seen: $seenLabel"
          Write-Output "[diag] (a) bare-app EBWebView present: $(Test-Path -LiteralPath (Join-Path $udf 'EBWebView'))"
          Write-Output "[diag] (a) app-alone HasExited=$($p.HasExited) ExitCode=$(if ($p.HasExited) { $p.ExitCode } else { 'n/a' })"
          Write-Output '[diag] tasklist (app + webview2 host):'
          tasklist /FI "IMAGENAME eq conductor-tauri.exe" | Select-Object -Last 3
          tasklist /FI "IMAGENAME eq msedgewebview2.exe" | Select-Object -Last 3
          # The module-version reading has to be taken HERE. Its subject is a live process, and the
          # `WebView2 cause probes (diagnostic)` step below runs after the Stop-Process on the next line —
          # measured 0.645 s after, at run 34586959536, where all three of its section-(2) lines read
          # `no live process`. Placement, not a longer timeout: no timeout recovers a dead process.
          .\scripts\webview2-cause-probe.ps1 -Section modules
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          # (b) must observe the driver's UNMODIFIED behaviour, so the control's handles are cleared.
          $env:WEBVIEW2_USER_DATA_FOLDER = $null
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $null
          Start-Sleep -Seconds 2

          # (b) driver alone — tauri-driver's own translation, straight at msedgedriver.
          $log = Join-Path $env:RUNNER_TEMP 'msedgedriver.log'
          $drv = Start-Process -FilePath (Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe') `
            -ArgumentList '--port=9515', '--verbose', "--log-path=$log" -PassThru
          Start-Sleep -Seconds 3
          # The driver creates its OWN profile dir (dev host: %TEMP%\scoped_dir<pid>_<rand>\EBWebView
          # holding DevToolsActivePort, session in ~0.7s) and REMOVES it when the session fails — so
          # this poll must run DURING the POST below; a post-mortem listing measures nothing.
          # Two selection traps, both measured on the dev host: msedgedriver creates TWO scoped_dir
          # siblings per session (same pid, different suffix) and only ONE holds the profile, and
          # earlier runs leave their own behind — so scan EVERY dir created after $since, never the
          # first match. Leaf names only, never a path.
          $poll = Start-Job -ArgumentList $env:TEMP, (Get-Date) -ScriptBlock {
            param($tmp, $since)
            $first = -1; $leaf = ''; $eb = $false; $dtap = $false; $n = 0
            foreach ($s in 1..90) {
              Start-Sleep -Seconds 1
              $dirs = @(Get-ChildItem -Path $tmp -Filter 'scoped_dir*' -Directory -ErrorAction SilentlyContinue |
                          Where-Object { $_.CreationTime -ge $since })
              $n = $dirs.Count
              if ($n -gt 0 -and $first -lt 0) { $first = $s }
              foreach ($d in $dirs) {
                if (Test-Path -LiteralPath (Join-Path $d.FullName 'EBWebView')) { $eb = $true; $leaf = $d.Name }
                if (Test-Path -LiteralPath (Join-Path $d.FullName 'EBWebView\DevToolsActivePort')) { $dtap = $true }
              }
              if ($dtap) { break }
            }
            [pscustomobject]@{ First = $first; Count = $n; Leaf = $leaf; EBWebView = $eb; DevToolsActivePort = $dtap }
          }
          # browserName MUST be 'webview2' — it is what selects the driver's WebView2-HOST launch mode.
          # Without it the same POST fails on the DEV HOST too, byte-for-byte the runner's failure (env
          # var empty, Chromium switches on argv, DevToolsActivePort missing) against a binary that
          # passes 12/12 through tauri-driver — i.e. the omission makes the probe measure itself.
          # Validated on the dev host before this form was pushed.
          $caps = @{ capabilities = @{ alwaysMatch = @{ browserName = 'webview2'; 'ms:edgeOptions' = @{ binary = $app; webviewOptions = @{} } } } } | ConvertTo-Json -Depth 8 -Compress
          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:9515/session' -Method POST -Body $caps `
              -ContentType 'application/json' -TimeoutSec 90 -SkipHttpErrorCheck
            Write-Output "[diag] driver-alone status=$($r.StatusCode)"
            Write-Output "[diag] driver-alone body: $($r.Content)"
          } catch {
            Write-Output "[diag] driver-alone threw: $($_.Exception.Message)"
          }
          # Wait-Job carries -Timeout; Receive-Job does not (measured on the dev host — the -Timeout
          # form throws and the poll silently returns nothing).
          $null = Wait-Job -Job $poll -Timeout 120
          $res = Receive-Job -Job $poll
          Stop-Job -Job $poll -ErrorAction SilentlyContinue
          Remove-Job -Job $poll -Force -ErrorAction SilentlyContinue
          if ($res) {
            $firstLabel = if ($res.First -ge 0) { "$($res.First)s" } else { 'never' }
            Write-Output "[diag] (b) fresh scoped_dir first seen: $firstLabel  count: $($res.Count)"
            Write-Output "[diag] (b) scoped_dir holding EBWebView: $(if ($res.Leaf) { $res.Leaf } else { 'none' })"
            Write-Output "[diag] (b) any fresh scoped_dir EBWebView present: $($res.EBWebView)"
            Write-Output "[diag] (b) any fresh scoped_dir DevToolsActivePort present: $($res.DevToolsActivePort)"
          } else {
            Write-Output '[diag] (b) scoped_dir poll returned nothing'
          }
          Stop-Process -Id $drv.Id -Force -ErrorAction SilentlyContinue

          # (c) default-profile fallback — present means the app used its own profile rather than the
          # folder the driver set for it.
          $fallback = Join-Path $env:LOCALAPPDATA 'com.andromeda.conductor\EBWebView'
          Write-Output "[diag] (c) LOCALAPPDATA app EBWebView present: $(Test-Path -LiteralPath $fallback)"

          # (d) stage the logs (+ any crashpad dir) under one dir; names only, never host paths.
          # conductor-tauri.jsonl is the app's own self-obs sink, written unconditionally beside the runs
          # dir (obs-plan §3), so it witnesses "the backend started" INDEPENDENTLY of DevToolsActivePort —
          # which is the whole reading (a) turns on: an app that is alive with no endpoint.
          $out = Join-Path $env:RUNNER_TEMP 'session-diag'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $applog = Join-Path $PWD 'runs\logs\conductor-tauri.jsonl'
          # msedgedriver-medium.log is the same driver's verbose log from the medium-integrity
          # driver-alone step above — the pair is what makes the two readings comparable.
          # Every driver-alone variant's verbose log — port and pipe, medium and high — so the transport
          # comparison is readable from the artifact and not only from the job log's summary counts.
          $variants = @(Get-ChildItem -Path (Join-Path $PWD 'runs') -Filter 'msedgedriver-*.log' -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          foreach ($f in (@($err, $log, $applog) + $variants)) { if (Test-Path -LiteralPath $f) { Copy-Item $f $out -Force } }
          Get-ChildItem -Path $env:RUNNER_TEMP, $env:LOCALAPPDATA -Filter 'Crashpad' -Directory -Recurse -Depth 4 -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName (Join-Path $out 'Crashpad') -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Output "[diag] staged: $((Get-ChildItem $out -Recurse -File | Measure-Object).Count) file(s)"

      # The three candidates that survive the falsified runtime-major hypothesis (run 34280136892 installed
      # Evergreen 152.0.4191.66 and DevToolsActivePort still never appeared within 90s): the image's WebView2
      # /Edge POLICY state, the module version the host processes ACTUALLY LOADED — which the install gate's
      # EdgeUpdate `pv` read cannot speak to, since it proves what was installed and not what was mapped — and
      # the runner's SESSION identity. The body lives in a repo script rather than inline so the SAME code
      # produces the dev-host control the CI reading is compared against; an inline body can only ever run here,
      # and a hand-approximated control is the weaker basis for deciding remediable-vs-permanent.
      # Diagnose-only, like its two neighbours: it exits 0 whatever it finds and can never decide the gate.
      - name: WebView2 cause probes (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: .\scripts\webview2-cause-probe.ps1

      # A SECOND candidate route, measured in the same run so one job answers both questions.
      # msedgedriver hands WebView2 `--remote-debugging-port=0` through WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
      # and then waits for the DevToolsActivePort FILE to appear; its own log recommends the pipe transport
      # instead ("Use the --remote-debugging-pipe Chrome switch instead of the default
      # --remote-debugging-port"). If WebView2's loader honours the pipe, the endpoint never needs the file
      # and the elevation cause is sidestepped rather than treated — which is why this is a DIAGNOSTIC and
      # not the arm: it reports whether the route exists, and can never decide the gate.
      - name: Remote-debugging-pipe route (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CONDUCTOR_ENV: dev
        run: |
          $app = Join-Path $PWD 'target\release\conductor-tauri.exe'
          if (-not (Test-Path -LiteralPath $app)) { Write-Output '[diag] pipe-route app binary: NOT BUILT'; exit 0 }
          $udf = Join-Path $env:RUNNER_TEMP 'wv2-pipe'
          Remove-Item -LiteralPath $udf -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $udf | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = $udf
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-pipe'
          $p = Start-Process -FilePath $app -WorkingDirectory $PWD -PassThru
          try {
            $seen = -1
            foreach ($s in 1..60) {
              Start-Sleep -Seconds 1
              if (Test-Path -LiteralPath (Join-Path $udf 'EBWebView')) { $seen = $s; break }
            }
            $label = if ($seen -ge 0) { "${seen}s" } else { 'never within 60s' }
            Write-Output "[diag] pipe-route EBWebView first seen: $label"
            Write-Output "[diag] pipe-route DevToolsActivePort present: $(Test-Path -LiteralPath (Join-Path $udf 'EBWebView\DevToolsActivePort'))"
            Write-Output "[diag] pipe-route app alive: $(-not $p.HasExited)"
            # The question the route turns on: does the loader ACCEPT the pipe switch, or reject the argument
            # and fail to bring the webview up at all? A live app with its profile created is acceptance;
            # an exited app is rejection, and says the route is closed without any token work.
          } finally {
            $env:WEBVIEW2_USER_DATA_FOLDER = $null
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $null
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload session diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a11y-session-diag
          path: ${{ runner.temp }}/session-diag
          if-no-files-found: warn

      # Conformance is asserted by REUSING conductor-run's journal_conformance test, pointed at the a11y
      # dir. Re-listing the eleven envelope keys here would be the same third copy of the schema the
      # run-journal gate above exists to avoid. The test fails loudly on an empty dir, so a leg that
      # produced no record cannot pass this step silently.
      - name: A11y violation-JSON conformance gate
        shell: bash
        env:
          CONDUCTOR_RUNS_DIR: runs/a11y
        run: |
          ls runs/a11y/*.jsonl >/dev/null 2>&1 || { echo "::error::the a11y leg wrote no violation record to assert over"; exit 1; }
          cargo nextest run -p conductor-run --test journal_conformance --profile ci
          echo "a11y violation-JSON conformance: PASS ($(ls runs/a11y/*.jsonl | wc -l) record(s) checked)"

      - name: Upload a11y violation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-violations
          path: runs/a11y/*.jsonl
          if-no-files-found: warn
