name: CI

on:
  push:
  pull_request:
  # workflow_dispatch:  # reserved for the future live-Pulse / operator gate (Epoch 10)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gate (build · test · lint · supply-chain · coverage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pin + components come from rust-toolchain.toml (channel 1.95.0 >= MSRV 1.94.1;
      # clippy + llvm-tools-preview). rustup auto-installs it on first use.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binaries (not cargo-install-from-source) keep the Windows runner fast.
      - name: Install cargo subcommands
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,cargo-llvm-cov

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      # conductor-tauri's generate_context! resolves build.frontendDist (ui/dist) at compile time, so
      # the webview bundle must exist before the workspace build compiles conductor-tauri (Epoch 9).
      - name: Build frontend bundle (ui/dist)
        working-directory: crates/conductor-tauri/ui
        run: |
          npm ci
          npm run build

      # --locked enforces the committed, un-drifted Cargo.lock (security-plan §Dependency Security).
      - name: Build (locked)
        run: cargo build --workspace --locked

      # Flakiness budget — assert the determinism invariant at the CI level, not the local file alone:
      # any non-zero `retries` (count or backoff-map) in the nextest config fails the gate
      # (test-plan §10 zero-flakiness; arch §Cross-cutting Patterns determinism discipline).
      - name: Flakiness budget (assert zero-retry)
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*retries[[:space:]]*=[[:space:]]*([1-9]|\{)' .config/nextest.toml; then
            echo "::error file=.config/nextest.toml::non-zero retries configured — the zero-flakiness budget forbids retries (test-plan §10)"
            exit 1
          fi

      # Dogfood the source-of-truth release gate: agent-run `run` = nextest --profile ci (zero-retry,
      # emits target/nextest/ci/junit.xml) + test --doc + clippy -D warnings. Setting
      # $PSNativeCommandUseErrorActionPreference makes the script fail-fast on the first native
      # non-zero exit regardless of the pwsh default (mirrors the .sh `set -e`).
      - name: Test + lint (dogfood agent-run)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\scripts\agent-run.ps1 run

      - name: Supply-chain — cargo audit
        run: cargo audit

      - name: Supply-chain — cargo deny
        run: cargo deny check

      # Coverage gate (Epoch 10): instrumented re-run → LCOV + Cobertura reports → the binding
      # line-coverage floor. test-plan §10: Minimal tier line >= 60% (--fail-under-lines 60),
      # excluding integration-test / fixture / stub code under crates/*/tests/. The workspace has no
      # in-tree OTLP codegen — opentelemetry-proto is an external crate llvm-cov already excludes.
      - name: Coverage (collect instrumented)
        run: cargo llvm-cov nextest --workspace --profile ci --no-report

      - name: Coverage (LCOV + Cobertura reports)
        shell: bash
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '[\\/]tests[\\/]'
          cargo llvm-cov report --cobertura --output-path coverage.xml --ignore-filename-regex '[\\/]tests[\\/]'

      - name: Coverage (line-floor gate — test-plan §10, >= 60%)
        run: cargo llvm-cov report --fail-under-lines 60 --ignore-filename-regex '[\\/]tests[\\/]'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.xml

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/nextest/ci/junit.xml

  frontend:
    name: Frontend gate (npm audit · build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/conductor-tauri/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      - name: Install (clean)
        run: npm ci

      # 0 PRODUCTION vulnerabilities required; dev-only test-tooling advisories accepted at
      # dev-tree grain (security-plan §Dependency Security / Frontend npm — the npm analogue of
      # the deny.toml accepted-exceptions mechanism; the a11y harness never ships).
      - name: Supply-chain — npm audit (production deps)
        run: npm audit --omit=dev

      - name: Build (tsc --noEmit && vite build)
        run: npm run build
