name: CI

on:
  push:
  pull_request:
  # workflow_dispatch:  # reserved for the future live-Pulse / operator gate (Epoch 10)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gate (build · test · lint · supply-chain · coverage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pin + components come from rust-toolchain.toml (channel 1.95.0 >= MSRV 1.94.1;
      # clippy + llvm-tools-preview). rustup auto-installs it on first use.
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      # Placed here, ahead of the cache restore and the build, because rustfmt needs only the toolchain
      # the preceding step installs — no cache, no node, no bundle, no compile. A formatting violation is
      # reported in seconds instead of after the ~18 min build+test path. --all, not the bare form: the
      # workspace declares no default-members, so the two are equivalent today and would diverge the
      # moment one is added. test-plan §9 Lint row; §9/§10 make a fmt failure a build-FAILURE condition.
      - name: Formatting gate (cargo fmt)
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binaries (not cargo-install-from-source) keep the Windows runner fast.
      - name: Install cargo subcommands
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-deny,cargo-llvm-cov

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      # conductor-tauri's generate_context! resolves build.frontendDist (ui/dist) at compile time, so
      # the webview bundle must exist before the workspace build compiles conductor-tauri (Epoch 9).
      - name: Build frontend bundle (ui/dist)
        working-directory: crates/conductor-tauri/ui
        run: |
          npm ci
          npm run build

      # --locked enforces the committed, un-drifted Cargo.lock (security-plan §Dependency Security).
      - name: Build (locked)
        run: cargo build --workspace --locked

      # Flakiness budget — assert the determinism invariant at the CI level, not the local file alone:
      # any non-zero `retries` (count or backoff-map) in the nextest config fails the gate
      # (test-plan §10 zero-flakiness; arch §Cross-cutting Patterns determinism discipline).
      - name: Flakiness budget (assert zero-retry)
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*retries[[:space:]]*=[[:space:]]*([1-9]|\{)' .config/nextest.toml; then
            echo "::error file=.config/nextest.toml::non-zero retries configured — the zero-flakiness budget forbids retries (test-plan §10)"
            exit 1
          fi

      # Dogfood the source-of-truth release gate: agent-run `run` = nextest --profile ci (zero-retry,
      # emits target/nextest/ci/junit.xml) + test --doc + clippy -D warnings. Setting
      # $PSNativeCommandUseErrorActionPreference makes the script fail-fast on the first native
      # non-zero exit regardless of the pwsh default (mirrors the .sh `set -e`).
      - name: Test + lint (dogfood agent-run)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\scripts\agent-run.ps1 run

      # Coverage-completeness gate (test-plan §1 Critical Path 6 — the definition-of-done gate).
      # The subject is the COMMITTED coverage-matrix.md; the gate byte-compares it to the production
      # renderer, so a classification change that skipped regeneration fails here rather than
      # shipping a stale artifact. Re-listing the classification in jq would be a second copy that
      # drifts from `coverage_matrix()`, so the gate is the Rust test.
      - name: Coverage-completeness gate
        shell: bash
        run: |
          test -f coverage-matrix.md || { echo "::error::coverage-matrix.md is absent — the gate has no subject"; exit 1; }
          cargo nextest run -p conductor-report --test coverage_gate --profile ci
          echo "coverage completeness: PASS ($(grep -cE '^\| `P-' coverage-matrix.md) capabilities classified)"

      - name: Supply-chain — cargo audit
        run: cargo audit

      - name: Supply-chain — cargo deny
        run: cargo deny check

      # Coverage gate (Epoch 10): instrumented re-run → LCOV + Cobertura reports → the binding
      # line-coverage floor. test-plan §10: Minimal tier line >= 60% (--fail-under-lines 60),
      # excluding integration-test / fixture / stub code under crates/*/tests/. The workspace has no
      # in-tree OTLP codegen — opentelemetry-proto is an external crate llvm-cov already excludes.
      - name: Coverage (collect instrumented)
        run: cargo llvm-cov nextest --workspace --profile ci --no-report

      - name: Coverage (LCOV + Cobertura reports)
        shell: bash
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '[\\/]tests[\\/]'
          cargo llvm-cov report --cobertura --output-path coverage.xml --ignore-filename-regex '[\\/]tests[\\/]'

      - name: Coverage (line-floor gate — test-plan §10, >= 60%)
        run: cargo llvm-cov report --fail-under-lines 60 --ignore-filename-regex '[\\/]tests[\\/]'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.xml

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/nextest/ci/junit.xml

      # Obs CI conformance gate (Epoch 10 — obs-plan §9/§10). Produce Conductor's OWN self-observation
      # artifact in CI, assert it conforms to the self-obs base schema + the redaction boundary + zero
      # unlogged panics, then upload it. CI-config only — the obs sink it asserts is unchanged.
      # ANDROMEDA_PULSE_DATA_DIR carries an injection metacharacter → conductor-verify rejects it BEFORE any
      # sidecar spawn → a Blocked envelope (exit 0); init_observability still writes every self-obs line to
      # logs/agent-latest.jsonl (the hermetic no-live-Pulse lever; cli_smoke.rs precedent). No Pulse needed.
      - name: Obs conformance — produce agent-latest.jsonl (no-Pulse Blocked run)
        shell: bash
        env:
          ANDROMEDA_PULSE_DATA_DIR: 'pulse;injection'
        run: |
          mkdir -p logs
          # Capture stderr too: an UNSTRUCTURED panic (a bypassed set_hook) lands on stderr, not the JSON
          # file sink, so the zero-unlogged-panics gate greps both (obs-plan §9).
          cargo run -q -p conductor-cli --bin conductor -- run error-baseline-spike --seed 424242 --agent-mode 2> logs/producer-stderr.log

      # Assert the self-obs BASE-line schema (obs-plan §3 "two record shapes" — NOT the run-report envelope,
      # which lives in runs/<run_id>.jsonl), the redaction boundary (no absolute host path; anchors mirror
      # conductor-core::redact::is_host_path_token — `::` module paths are NOT flagged), and zero unlogged
      # panics (obs-plan §10). shell: bash for fail-fast multi-command (mirrors the flakiness-budget gate).
      - name: Obs conformance + zero-unlogged-panics gate
        shell: bash
        run: |
          log=logs/agent-latest.jsonl
          test -s "$log" || { echo "::error file=$log::self-obs artifact missing or empty"; exit 1; }
          # (a) every line carries the 7 required self-obs base fields (obs-plan §3/§6)
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            printf '%s' "$line" | jq -e '.timestamp_ms and .level and .target and .["service.name"] and .["service.version"] and .["deployment.environment"] and .run_id' >/dev/null \
              || { echo "::error file=$log::self-obs line missing a required base field"; exit 1; }
          done < "$log"
          # (b) redaction boundary — no absolute host path leaked (anchors mirror conductor-core::redact)
          if grep -nE '([A-Za-z]:[\\/]|/home/|/Users/|\\Users\\|/root/|%APPDATA%|%USERPROFILE%|%LOCALAPPDATA%|\$HOME|~/|\.cargo[\\/]|\.rustup[\\/])' "$log"; then
            echo "::error file=$log::absolute host path leaked into the self-obs artifact (redaction boundary)"; exit 1
          fi
          # (c) zero unlogged panics — grep the JSON sink AND the captured producer stderr (obs-plan §9):
          # an unstructured backtrace (bypassed set_hook) lands on stderr, not the file. Only a structured
          # tracing::error!(panic=…) JSON line is acceptable (obs-plan §10).
          if grep -nE '^thread.*panicked' "$log" logs/producer-stderr.log; then
            echo "::error::unstructured panic backtrace found (zero-unlogged-panics gate)"; exit 1
          fi
          echo "obs conformance + zero-unlogged-panics: PASS ($(wc -l < "$log") lines checked)"

      # Run-report envelope conformance gate (obs-plan §9/§10 — the envelope's own gate, reserved
      # there as not-yet-built). The producer above ALSO wrote runs/<run_id>.jsonl, which nothing
      # asserted until now. The gate is the RUST test, pointed at that journal: re-listing the
      # eleven envelope / nine CheckRecord key names in jq would be a third copy of the schema
      # (the structs · obs-plan §3/§6 · this file) and would drift from the first two.
      - name: Run-journal conformance gate
        shell: bash
        env:
          CONDUCTOR_RUNS_DIR: runs
        run: |
          ls runs/*.jsonl >/dev/null 2>&1 || { echo "::error::the producer wrote no run journal to assert over"; exit 1; }
          cargo nextest run -p conductor-run --test journal_conformance --profile ci
          echo "run-journal conformance: PASS ($(ls runs/*.jsonl | wc -l) journals checked)"

      - name: Upload obs self-observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-conformance
          path: logs/agent-latest.jsonl

  frontend:
    name: Frontend gate (npm audit · build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/conductor-tauri/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      - name: Install (clean)
        run: npm ci

      # 0 PRODUCTION vulnerabilities required; dev-only test-tooling advisories accepted at
      # dev-tree grain (security-plan §Dependency Security / Frontend npm — the npm analogue of
      # the deny.toml accepted-exceptions mechanism; the a11y harness never ships).
      - name: Supply-chain — npm audit (production deps)
        run: npm audit --omit=dev

      - name: Build (tsc --noEmit && vite build)
        run: npm run build

  # The a11y gate (a11y-plan §3 a11y-ci-gate-wire / violation-json-emission-wire; §9 CI Integration).
  # The ROUTINE arm only: it needs no live Pulse (it seeds its own committed fixture through the
  # production writer), while the driven and sr* suites do and are barred from CI by test-plan §11 and
  # architecture §Established Decisions [CI/CD].
  a11y:
    name: A11y gate (routine arm · axe · contrast · violation JSON)
    # Pinned to the EXPLICIT label rather than windows-latest: this job drives the Edge WebDriver the
    # runner image ships, so a silent -latest move could change the driver out from under the gate.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # cargo-nextest runs the conformance gate below; tauri-driver is an npm package resolved from
      # node_modules by wdio.conf.ts, so it needs no cargo install.
      - name: Install cargo subcommands
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/conductor-tauri/ui/package-lock.json

      # The runtime MAJOR is the one variable every passing case shares and the failing case lacks:
      # passing = runtime 152 under a 151 driver (2026-09-02 morning) and under a 152 driver (since
      # 2026-09-02 14:45); failing = runtime 151 under a 151 driver, on this image. Measured at run
      # 34234558853, where a bare launch with NO DRIVER in the picture never produced DevToolsActivePort
      # within 90s while the identical form on the dev host produces it in 1s — which is what retired every
      # driver-layer hypothesis and left the runtime as the variable no probe had varied.
      # A GATE, not a diagnostic: the session-isolation probe below is only worth running against a runtime
      # this step actually replaced, so a silent no-op leaving the image at 151 must fail here rather than
      # read downstream as a falsified hypothesis. The major is asserted, never "the version changed" —
      # the latter false-reds on any host already at 152+ and catches nothing the former misses.
      - name: Install WebView2 Evergreen runtime 152+ (gate)
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          function Get-Wv2Version {
            $keys | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
              Where-Object { $_ } | Select-Object -First 1
          }

          $before = Get-Wv2Version
          Write-Output "[diag] WebView2 Evergreen Runtime before install: $(if ($before) { $before } else { 'NOT INSTALLED' })"

          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper

          # Terminal gate, evaluated BEFORE the file is executed: a signature check that warns and proceeds
          # is the silent-downgrade shape security-plan bans. Handle NAME + state only, never the path.
          $sig = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($sig.Status -ne 'Valid') {
            Write-Output "[precondition] WEBVIEW2_BOOTSTRAPPER_SIGNATURE: NOT VALID ($($sig.Status))"
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            Write-Output '[precondition] WEBVIEW2_BOOTSTRAPPER_SIGNATURE: VALID BUT UNEXPECTED SIGNER'
            exit 1
          }
          Write-Output '[precondition] WEBVIEW2_BOOTSTRAPPER_SIGNATURE: valid, Microsoft Corporation'

          $p = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Output "[precondition] WEBVIEW2_RUNTIME_INSTALL: FAILED (exit $($p.ExitCode))"
            exit 1
          }

          $after = Get-Wv2Version
          Write-Output "[diag] WebView2 Evergreen Runtime after install: $(if ($after) { $after } else { 'NOT INSTALLED' })"
          if (-not $after) {
            Write-Output '[precondition] WEBVIEW2_RUNTIME_MAJOR: NO EdgeUpdate client key after install'
            exit 1
          }
          $major = [int]($after.Split('.')[0])
          if ($major -lt 152) {
            Write-Output "[precondition] WEBVIEW2_RUNTIME_MAJOR: $major (need 152 or newer)"
            exit 1
          }
          Write-Output "[precondition] WEBVIEW2_RUNTIME_MAJOR: $major"

      # The harness verb owns the ordering (ensure_frontend -> release build with
      # --features tauri/custom-protocol -> wdio run), so the job does not restate it.
      #
      # CONDUCTOR_A11Y_STRICT inverts the leg's skip-at-exit-0 guard: on a dev host an unresolved
      # handle SKIPS so an unconfigured machine is not read as a defect, but a gate that can pass by
      # skipping is banned (a11y-plan §11 Anti-Patterns -> CI). The guard itself is untouched.
      #
      # EDGEWEBDRIVER is set by the runner image (Microsoft Edge Driver ships with it), so there is no
      # driver install step and no operator handle in CI. It is a runner-PROCESS variable, so it is
      # resolved in the step's SHELL: the ${{ env.* }} expression context holds only what a workflow,
      # job or step declared, and resolving it there yielded an empty base — the handle reached the
      # guard as the literal "\msedgedriver.exe" and the strict arm correctly failed the gate
      # (measured 2026-09-07, run 34148079506).
      # The driver and the WebView2 RUNTIME are two different image facts, and only the driver has ever
      # been confirmed. A session that never starts cannot say which is missing, so both versions are
      # printed before the leg runs — the driver from its own binary, the runtime from the registry key
      # the SR record already reads (`webview2_runtime_registry`). Diagnostic only: it exits 0 whatever
      # it finds, so it can never itself decide the gate.
      - name: WebView2 driver + runtime versions (diagnostic)
        shell: pwsh
        continue-on-error: true
        run: |
          $d = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          if (Test-Path -LiteralPath $d) {
            Write-Output "[diag] msedgedriver: $((Get-Item $d).VersionInfo.ProductVersion)"
          } else { Write-Output '[diag] msedgedriver: NOT PRESENT' }
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $rt = $keys | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
                Where-Object { $_ } | Select-Object -First 1
          if ($rt) { Write-Output "[diag] WebView2 Evergreen Runtime: $rt" }
          else { Write-Output '[diag] WebView2 Evergreen Runtime: NOT INSTALLED (no EdgeUpdate client key)' }
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (Test-Path -LiteralPath $edge) {
            Write-Output "[diag] Edge browser: $((Get-Item $edge).VersionInfo.ProductVersion)"
          } else { Write-Output '[diag] Edge browser: NOT PRESENT' }

      - name: A11y routine arm (tauri-driver + axe + contrast)
        shell: pwsh
        env:
          CONDUCTOR_A11Y_STRICT: '1'
          CONDUCTOR_ENV: dev
        run: |
          if (-not $env:EDGEWEBDRIVER) {
            Write-Output '[precondition] EDGEWEBDRIVER: NOT SET by the runner image'
            exit 1
          }
          $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            Write-Output '[precondition] CONDUCTOR_MSEDGEDRIVER: NOT RESOLVED'
            exit 1
          }
          Write-Output '[precondition] CONDUCTOR_MSEDGEDRIVER: resolved'
          $env:CONDUCTOR_MSEDGEDRIVER = $driver
          # No $PSNativeCommandUseErrorActionPreference here. It makes the harness's non-zero a
          # TERMINATING error at its `npm run a11y` call, before agent-run.ps1 prints the captured wdio
          # output the gate's verdict is read from — the job log then carries one
          # NativeCommandExitException line and none of wdio's own (measured 2026-09-07). The harness
          # already reads $LASTEXITCODE from the bare command and exits with it, so the preference adds
          # no detection and only destroys the diagnostic.
          .\scripts\agent-run.ps1 run --e2e

      # Isolates `session not created: DevToolsActivePort file doesn't exist` — the WARN-level line the
      # driver retries on, which says msedgedriver launched the app and never found its DevTools port.
      # Runs AFTER the routine arm, not before: the arm's own step performs the release build, so there
      # is no binary to launch until it has run. `if: always()` + continue-on-error keep it a diagnostic
      # that can never decide the gate.
      - name: WebView2 session isolation (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CONDUCTOR_RUNS_DIR: runs/e2e-fixture
          CONDUCTOR_ENV: dev
        run: |
          $app = Join-Path $PWD 'target\release\conductor-tauri.exe'
          if (-not (Test-Path -LiteralPath $app)) { Write-Output '[diag] app binary: NOT BUILT'; exit 0 }
          Write-Output '[diag] app binary: present'

          # The driver builds its scoped profile under TEMP while (a) below uses RUNNER_TEMP; whether
          # those share a volume is a candidate discriminator, so it is recorded as a boolean.
          $tempRoot = [System.IO.Path]::GetPathRoot($env:TEMP)
          $runnerRoot = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          Write-Output "[diag] TEMP and RUNNER_TEMP share a volume: $($tempRoot -eq $runnerRoot)"

          # (a) bare-app control. On the dev host the loader honours WEBVIEW2_USER_DATA_FOLDER and writes
          # DevToolsActivePort under it in 1s. Polling (rather than one sleep) is what separates "the
          # runner's loader ignores the handle" from "it is merely slow" from "it never appears".
          $udf = Join-Path $env:RUNNER_TEMP 'wv2-control'
          New-Item -ItemType Directory -Force -Path $udf | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = $udf
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=0'
          $err = Join-Path $env:RUNNER_TEMP 'app.stderr.txt'
          $p = Start-Process -FilePath $app -WorkingDirectory $PWD -PassThru -RedirectStandardError $err
          $port = Join-Path $udf 'EBWebView\DevToolsActivePort'
          $seen = -1
          foreach ($s in 1..90) {
            Start-Sleep -Seconds 1
            if (Test-Path -LiteralPath $port) { $seen = $s; break }
          }
          $seenLabel = if ($seen -ge 0) { "${seen}s" } else { 'never within 90s' }
          Write-Output "[diag] (a) bare-app DevToolsActivePort first seen: $seenLabel"
          Write-Output "[diag] (a) bare-app EBWebView present: $(Test-Path -LiteralPath (Join-Path $udf 'EBWebView'))"
          Write-Output "[diag] (a) app-alone HasExited=$($p.HasExited) ExitCode=$(if ($p.HasExited) { $p.ExitCode } else { 'n/a' })"
          Write-Output '[diag] tasklist (app + webview2 host):'
          tasklist /FI "IMAGENAME eq conductor-tauri.exe" | Select-Object -Last 3
          tasklist /FI "IMAGENAME eq msedgewebview2.exe" | Select-Object -Last 3
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          # (b) must observe the driver's UNMODIFIED behaviour, so the control's handles are cleared.
          $env:WEBVIEW2_USER_DATA_FOLDER = $null
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $null
          Start-Sleep -Seconds 2

          # (b) driver alone — tauri-driver's own translation, straight at msedgedriver.
          $log = Join-Path $env:RUNNER_TEMP 'msedgedriver.log'
          $drv = Start-Process -FilePath (Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe') `
            -ArgumentList '--port=9515', '--verbose', "--log-path=$log" -PassThru
          Start-Sleep -Seconds 3
          # The driver creates its OWN profile dir (dev host: %TEMP%\scoped_dir<pid>_<rand>\EBWebView
          # holding DevToolsActivePort, session in ~0.7s) and REMOVES it when the session fails — so
          # this poll must run DURING the POST below; a post-mortem listing measures nothing.
          # Two selection traps, both measured on the dev host: msedgedriver creates TWO scoped_dir
          # siblings per session (same pid, different suffix) and only ONE holds the profile, and
          # earlier runs leave their own behind — so scan EVERY dir created after $since, never the
          # first match. Leaf names only, never a path.
          $poll = Start-Job -ArgumentList $env:TEMP, (Get-Date) -ScriptBlock {
            param($tmp, $since)
            $first = -1; $leaf = ''; $eb = $false; $dtap = $false; $n = 0
            foreach ($s in 1..90) {
              Start-Sleep -Seconds 1
              $dirs = @(Get-ChildItem -Path $tmp -Filter 'scoped_dir*' -Directory -ErrorAction SilentlyContinue |
                          Where-Object { $_.CreationTime -ge $since })
              $n = $dirs.Count
              if ($n -gt 0 -and $first -lt 0) { $first = $s }
              foreach ($d in $dirs) {
                if (Test-Path -LiteralPath (Join-Path $d.FullName 'EBWebView')) { $eb = $true; $leaf = $d.Name }
                if (Test-Path -LiteralPath (Join-Path $d.FullName 'EBWebView\DevToolsActivePort')) { $dtap = $true }
              }
              if ($dtap) { break }
            }
            [pscustomobject]@{ First = $first; Count = $n; Leaf = $leaf; EBWebView = $eb; DevToolsActivePort = $dtap }
          }
          # browserName MUST be 'webview2' — it is what selects the driver's WebView2-HOST launch mode.
          # Without it the same POST fails on the DEV HOST too, byte-for-byte the runner's failure (env
          # var empty, Chromium switches on argv, DevToolsActivePort missing) against a binary that
          # passes 12/12 through tauri-driver — i.e. the omission makes the probe measure itself.
          # Validated on the dev host before this form was pushed.
          $caps = @{ capabilities = @{ alwaysMatch = @{ browserName = 'webview2'; 'ms:edgeOptions' = @{ binary = $app; webviewOptions = @{} } } } } | ConvertTo-Json -Depth 8 -Compress
          try {
            $r = Invoke-WebRequest -Uri 'http://127.0.0.1:9515/session' -Method POST -Body $caps `
              -ContentType 'application/json' -TimeoutSec 90 -SkipHttpErrorCheck
            Write-Output "[diag] driver-alone status=$($r.StatusCode)"
            Write-Output "[diag] driver-alone body: $($r.Content)"
          } catch {
            Write-Output "[diag] driver-alone threw: $($_.Exception.Message)"
          }
          # Wait-Job carries -Timeout; Receive-Job does not (measured on the dev host — the -Timeout
          # form throws and the poll silently returns nothing).
          $null = Wait-Job -Job $poll -Timeout 120
          $res = Receive-Job -Job $poll
          Stop-Job -Job $poll -ErrorAction SilentlyContinue
          Remove-Job -Job $poll -Force -ErrorAction SilentlyContinue
          if ($res) {
            $firstLabel = if ($res.First -ge 0) { "$($res.First)s" } else { 'never' }
            Write-Output "[diag] (b) fresh scoped_dir first seen: $firstLabel  count: $($res.Count)"
            Write-Output "[diag] (b) scoped_dir holding EBWebView: $(if ($res.Leaf) { $res.Leaf } else { 'none' })"
            Write-Output "[diag] (b) any fresh scoped_dir EBWebView present: $($res.EBWebView)"
            Write-Output "[diag] (b) any fresh scoped_dir DevToolsActivePort present: $($res.DevToolsActivePort)"
          } else {
            Write-Output '[diag] (b) scoped_dir poll returned nothing'
          }
          Stop-Process -Id $drv.Id -Force -ErrorAction SilentlyContinue

          # (c) default-profile fallback — present means the app used its own profile rather than the
          # folder the driver set for it.
          $fallback = Join-Path $env:LOCALAPPDATA 'com.andromeda.conductor\EBWebView'
          Write-Output "[diag] (c) LOCALAPPDATA app EBWebView present: $(Test-Path -LiteralPath $fallback)"

          # (d) stage the logs (+ any crashpad dir) under one dir; names only, never host paths.
          # conductor-tauri.jsonl is the app's own self-obs sink, written unconditionally beside the runs
          # dir (obs-plan §3), so it witnesses "the backend started" INDEPENDENTLY of DevToolsActivePort —
          # which is the whole reading (a) turns on: an app that is alive with no endpoint.
          $out = Join-Path $env:RUNNER_TEMP 'session-diag'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $applog = Join-Path $PWD 'runs\logs\conductor-tauri.jsonl'
          foreach ($f in @($err, $log, $applog)) { if (Test-Path -LiteralPath $f) { Copy-Item $f $out -Force } }
          Get-ChildItem -Path $env:RUNNER_TEMP, $env:LOCALAPPDATA -Filter 'Crashpad' -Directory -Recurse -Depth 4 -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName (Join-Path $out 'Crashpad') -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Output "[diag] staged: $((Get-ChildItem $out -Recurse -File | Measure-Object).Count) file(s)"

      # The three candidates that survive the falsified runtime-major hypothesis (run 34280136892 installed
      # Evergreen 152.0.4191.66 and DevToolsActivePort still never appeared within 90s): the image's WebView2
      # /Edge POLICY state, the module version the host processes ACTUALLY LOADED — which the install gate's
      # EdgeUpdate `pv` read cannot speak to, since it proves what was installed and not what was mapped — and
      # the runner's SESSION identity. The body lives in a repo script rather than inline so the SAME code
      # produces the dev-host control the CI reading is compared against; an inline body can only ever run here,
      # and a hand-approximated control is the weaker basis for deciding remediable-vs-permanent.
      # Diagnose-only, like its two neighbours: it exits 0 whatever it finds and can never decide the gate.
      - name: WebView2 cause probes (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: .\scripts\webview2-cause-probe.ps1

      - name: Upload session diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a11y-session-diag
          path: ${{ runner.temp }}/session-diag
          if-no-files-found: warn

      # Conformance is asserted by REUSING conductor-run's journal_conformance test, pointed at the a11y
      # dir. Re-listing the eleven envelope keys here would be the same third copy of the schema the
      # run-journal gate above exists to avoid. The test fails loudly on an empty dir, so a leg that
      # produced no record cannot pass this step silently.
      - name: A11y violation-JSON conformance gate
        shell: bash
        env:
          CONDUCTOR_RUNS_DIR: runs/a11y
        run: |
          ls runs/a11y/*.jsonl >/dev/null 2>&1 || { echo "::error::the a11y leg wrote no violation record to assert over"; exit 1; }
          cargo nextest run -p conductor-run --test journal_conformance --profile ci
          echo "a11y violation-JSON conformance: PASS ($(ls runs/a11y/*.jsonl | wc -l) record(s) checked)"

      - name: Upload a11y violation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-violations
          path: runs/a11y/*.jsonl
          if-no-files-found: warn
