[workspace]
resolver = "3"
members = [
    "crates/conductor-core",
    "crates/conductor-timeline",
    "crates/conductor-emit",
    "crates/conductor-faults",
    "crates/conductor-verify",
    "crates/conductor-report",
    "crates/conductor-run",
    "crates/conductor-cli",
    "crates/conductor-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false  # local-only personal tool — no conductor-* crate is ever published to crates.io

[workspace.dependencies]
# Internal seams (crate-per-seam edges inherit these)
conductor-core = { path = "crates/conductor-core" }
conductor-timeline = { path = "crates/conductor-timeline" }
conductor-emit = { path = "crates/conductor-emit" }
conductor-faults = { path = "crates/conductor-faults" }
conductor-verify = { path = "crates/conductor-verify" }
conductor-report = { path = "crates/conductor-report" }
conductor-run = { path = "crates/conductor-run" }

# Async runtime — core-owned, current_thread flavor
tokio = "1.48"

# Seedable PRNG — platform-stable ChaCha algorithm for reproducible timeline jitter
rand_chacha = "0.9"
rand_core = "0.9"

# OTLP emission (the PRODUCT fault stream to Pulse :4317)
opentelemetry-proto = "0.32.0"
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14"

# MCP read-back client
rmcp = "1.7.0"

# Storage — embedded SQLite index (bundled compiles SQLite C from source)
rusqlite = { version = "0.38.0", features = ["bundled"] }

# Config validation + errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
garde = "0.22.1"
thiserror = "2.0.18"
anyhow = "1.0.102"

# CLI argument parsing (conductor-cli verbs)
clap = { version = "4", features = ["derive"] }

# CLI line-oriented output rendering (conductor-cli, Epoch 8) — color is gated on a tty; status is never color-alone
owo-colors = "4"
indicatif = "0.17"
comfy-table = "7"

# CLI interactive operator-pause prompt (conductor-cli, Epoch 8 ch4) — isatty-gated; the headless path never blocks
inquire = "0.9"

# Self-observation — tracing JSON only (NO OTel SDK)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# Desktop GUI (Epoch 9; pinned ≥2.10.3 per security CVE-2026-42184)
tauri = "2.10.3"
tauri-build = "2"

# Test framework + fixtures (dev-deps only; cargo-nextest + cargo-llvm-cov are external cargo subcommands, not crates)
rstest = "0.26"
proptest = "1"
insta = "1"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
