# Pinned SUT capability manifest — the accepted Pulse capability set (arch §Occupied Resources).
#
# Scenario validation checks every `p_ids` entry against this set: an id present here is accepted,
# one absent is rejected. Widening Conductor to a new Pulse release is an edit to THIS FILE — the
# accepted set is data, never a compile-time constant (it was `001..=060` in Rust until 0.2.0, which
# is why a scenario naming anything Pulse shipped in v0.3.0 failed to load).
#
# A read / parse / bounds failure is a harness fault, never a verdict and never a silent widening.

