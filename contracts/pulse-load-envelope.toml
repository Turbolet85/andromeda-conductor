# Pinned SUT load envelope — the proven-good storm bounds scenario authors must stay inside
# (arch §Occupied Resources; intent §Theme 1 F4).
#
# Pulse's DuckDB append path stalls after sustained high-rate storm: ingest keeps receiving while
# `duckdb.append` stops, so `viz.query.traces` returns 0 rows and no new incidents form until
# restart. Conductor's whole method is sustained shaped load, so the harness can induce that stall
# itself — and a run that does is NOT evidence about Pulse. Such a run is classified
# environment-suspect, never Fail.
#
# PROVENANCE. These terms are a TRANSCRIBED SUT record, not a Conductor measurement. Nothing under
# `.andromeda/refs/` (Pulse's capability spec, MCP contract, or v0.2.0 audit) carries the stall;
# intent §Theme 1 F4 is the record we have. Treat a term as authoritative only as far as that record
# is, and re-transcribe when Pulse publishes its own.
#
# A read / parse / bounds failure is a harness fault, never a verdict and never a silent widening.

sut_version = "v0.3.0"
captured_at = "2026-08-09"
provenance = "intent §Theme 1 F4 — transcribed SUT record, not a Conductor measurement"

[envelope]
# THE ASSERTED TERMS, judged PER EMITTING PHASE. `EmissionSpec::occurrences` made both computable:
# a phase's rate is its occurrences over its gap, and its storm window is that gap. A phase declaring
# zero occurrences is quiet, not storm, so it is not judged at all.
max_sustained_rate_spans_per_s = 10000
max_sustained_storm_ms = 600000

# RECORDED, NOT ASSERTED. A scenario's total duration is the sum of its per-phase gaps. It is not a
# load bound: elapsed time is not storm time, and summing bursts separated by quiet describes no load
# the SUT ever sees. Kept so an author sees the whole-run scale, and read by the run contract's
# preflight-budget check.
max_scenario_duration_ms = 600000

# Exemptions — scenarios that breach an asserted term for a recorded reason. Held to EXACT-SET
# equality in both directions by `check_load_envelope`: an exemption whose scenario is now inside the
# envelope fails as ledger rot, and one naming no catalog scenario fails as a lost subject. It can
# only shrink under compulsion.
#
# THE LEDGER IS EMPTY. Both prior entries retired at the Epoch-2 "Dispatcher determinism goldens"
# entry, when the gate moved onto the per-phase sustained terms — every catalog scenario now passes
# unaided (longest single emitting phase 600s; peak rate 4/s).
#
# It retired one entry later than this file predicted, and by a different term. The prediction was
# that asserting SUMMED emitting-phase duration would suffice; measured, it does not — `activity-floor`
# sums to 900s of emitting time and `incident-auto-resolution` to 610s, so both would still breach and
# the summed re-scope would change no verdict. Summing disjoint bursts is not *sustained*:
# `activity-floor`'s three 300s bursts sit between 10-minute quiets, which is what its own exemption
# reason called idleness. Bounding the longest single emitting window is what the stall described at
# the top of this file actually needs.
