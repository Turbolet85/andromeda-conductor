[package]
name = "conductor-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
conductor-core.workspace = true
conductor-timeline.workspace = true
conductor-emit.workspace = true
# the port-occupier driver: a fault-declared phase binds/releases the occupier for its window
conductor-faults.workspace = true
conductor-verify.workspace = true
conductor-report.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true }
# the run contract's warm-up window paces its pre-roll emissions (conductor-core::RunContract)
tokio = { workspace = true, features = ["time"] }

[features]
# The operator/local live leg that mints the resolve-lifecycle capture. Declares NO dependency, so it
# adds zero package nodes to `Cargo.lock`; it exists only to keep the live-Pulse test out of a default
# `nextest` / `clippy` / release build, the `stub-server` precedent (test-plan §5 Drivers).
live-pulse = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "test-util"] }
assert_fs.workspace = true
# the loopback OTLP stub the dispatcher's per-family wire assertions capture against (test-plan §2)
opentelemetry-proto.workspace = true
tonic.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
# freezes the dispatched stream's shape-projection (test-plan §7 Golden artifacts)
insta.workspace = true
# parses Pulse's own JSONL log lines in the live-leg storm harvest (test-only; Pulse is the SUT)
serde_json.workspace = true
