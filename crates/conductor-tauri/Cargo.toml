[package]
name = "conductor-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
conductor-core.workspace = true
conductor-run.workspace = true
serde = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
# GUI-integration test harness (Epoch 9 ch9): tauri::test mock-runtime + Path-7 parity.
tauri = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
assert_fs = { workspace = true }
serde_json = { workspace = true }
# The Path-7 parity leg's CLI arm — test-plan §5 names the `assert_cmd` subprocess run as the second
# half of the mandated driver pair. Already a workspace dep (conductor-cli's cli_smoke), so it admits
# no new package to Cargo.lock.
assert_cmd = { workspace = true }
