[package]
name = "conductor-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
conductor-core.workspace = true
conductor-run.workspace = true
serde = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
# GUI-integration test harness (Epoch 9 ch9): the tauri::test mock-runtime command tier. The Path-7
# parity leg moved to conductor-cli/tests/, the package declaring the `conductor` bin, so its
# assert_cmd + assert_fs edges left with it.
tauri = { workspace = true, features = ["test"] }
# `time` backs the bounded awaits in pause.rs's hold tests: without a bound, a mutant that stops the
# oneshot ever being sent hangs the binary and reports as a timeout instead of a failure.
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
serde_json = { workspace = true }
