# The screen-reader leg's NVDA profile. Copied into runs/sr-leg/nvda-config/ at leg start and passed as
# `nvda -c <dir>`, so the pass never depends on — or writes into — the operator's own NVDA configuration.
#
# - the welcome dialog stays closed under -m (minimal mode) either way; the key makes it explicit
# - the `silence` synthesizer keeps the host quiet: NVDA still logs every utterance it WOULD speak at log
#   level 12, which is all the leg reads, and say-all pacing no longer waits on audio
# - automatic say-all on document load is off, so a focused document is not read end to end into the row
#   windows (measured 2026-09-02: the whole 83-row coverage matrix arrived as one utterance)
[general]
showWelcomeDialogAtStartup = False

[speech]
synth = silence
# the silence synth supports no voice languages, so every LangChangeCommand would otherwise be spoken as
# "English (not supported)" inside a row's speech (measured 2026-09-02)
autoLanguageSwitching = False

[virtualBuffers]
autoSayAllOnPageLoad = False
