[package]
name = "conductor-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
conductor-core.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "macros", "sync", "time"] }
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true

[features]
# Builds the `stub_pulse_mcp` test-support binary (a hand-rolled JSON-RPC server over stdio) for the
# live child-spawn preflight test. Off by default — the bin never ships in a release. `tokio/io-std`
# gives the bin process-global stdin/stdout.
stub-server = ["tokio/io-std"]

# Test-support stub MCP server (protocol 2024-11-05 + the 4 read-back tools + canary), spawned by
# `tests/preflight_spawn.rs`. Gated so a default build/clippy never compiles it.
[[bin]]
name = "stub_pulse_mcp"
path = "src/bin/stub_pulse_mcp.rs"
required-features = ["stub-server"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util", "time", "test-util"] }
serde_json.workspace = true
rstest.workspace = true
# temp sink for the self-obs artifact the read-back key-set witness reads back (test-plan §11)
assert_fs.workspace = true
