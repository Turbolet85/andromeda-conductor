# cargo-deny supply-chain policy — gate established by chunk 2026-06-15-dependency-audit-gate.
# Stacks atop `cargo audit` (RustSec). Run: cargo deny check advisories bans sources licenses
# Schema v2 (cargo-deny 0.19.x — v2 is the default; the `version` field is omitted deliberately).

[advisories]
# All RustSec advisories deny by default. Accepted, non-actionable advisories are listed here
# WITH a justifying comment — never a silent skip (security-plan §Dependency Security).
ignore = [
    # RUSTSEC-2025-0119 (number_prefix 0.4.0, via indicatif 0.17) was retired here by the
    # 2026-09-07 indicatif 0.17 → 0.18 bump: 0.18 replaced number_prefix with unit-prefix, the
    # crate left the lock entirely, and this entry's justification named that dependency path —
    # so it no longer describes anything the tree contains.

    # Retired 2026-10-11 (2026-10-11-conductors-window-retired): the sixteen `unmaintained` ignores
    # of the Tauri 2 desktop-GUI tree — the gtk-rs GTK3 Linux-webview crates (RUSTSEC-2024-0411..0420),
    # the rust-unic family via `urlpattern` → `tauri-utils` (RUSTSEC-2025-0075/0080/0081/0098/0100)
    # and `proc-macro-error` (RUSTSEC-2024-0370). The window crate left the workspace, its dependency
    # tree left the lock with it, and no crate these entries named remains — the ignore list is empty.
]

[bans]
multiple-versions = "warn"        # surface duplicate versions; tighten to "deny" once the tree stabilizes
wildcards = "deny"
allow-wildcard-paths = true       # internal crate-per-seam path deps carry no version — expected, not a wildcard risk
deny = []                         # no disallowed crates yet — extend as the tree grows

[licenses]
# Permissive allowlist for a local-only personal tool; copyleft / unknown denied.
# Additive — extend ONLY with licenses actually present in the committed lock.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "BSD-3-Clause",  # matchit (axum→tonic gRPC tree); OSI/FSF permissive
    "Zlib",          # foldhash (rusqlite→hashbrown→foldhash 0.2.0); OSI-approved + FSF Free/Libre, permissive
    "BSD-2-Clause",  # arrayref (conductor-emit→blake3); OSI-approved + FSF Free/Libre, permissive
    # Retired 2026-10-11 (2026-10-11-conductors-window-retired): `MPL-2.0`, allowed for the Tauri 2
    # desktop-GUI tree (option-ext and others); the window crate's dependency tree left the lock and
    # no remaining package carries it.
    "Apache-2.0 WITH LLVM-exception",  # blake3, rustix/linux-raw-sys, the wasi/wit-bindgen/wasm-* tree (each an OR-expression); Apache-2.0 plus the LLVM linking exception, OSI/FSF permissive
]
confidence-threshold = 0.8
# The workspace's own conductor-* crates are license-checked like any dependency: they carry
# `MIT OR Apache-2.0`, inherited from `[workspace.package]`, so a member shipped without a license
# fails this gate. They stay unpublished (`publish = false`), which no longer exempts them.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
