# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-023 — Acknowledge Cool-Down (pulse-capability-spec.md §P-023). Severity-calibration family.
#   P-023 — after a user acknowledges an incident, a 5-minute cool-down applies: re-detection of the SAME
#     incident kind-and-scope WITHIN the window does NOT create a new active incident (but is recorded in
#     corpus); re-detection AFTER the window creates a new incident. Cool-down is per kind-and-scope.
#
# DECLARE-ONLY (2026-08-21-severity-lifecycle-live-proof). This file previously asserted the after-window
# leg as Hard (`CountAtLeast "2"`). That check was retired against THREE measured grounds, each
# independently sufficient — the file's own P4-era note had already recorded the first:
#   (1) NO ACK MECHANISM. The pinned four-tool MCP contract carries no acknowledge action, and
#       `mark_incident_resolved` is a RESOLVE write (it sets status resolved), not an ack — so the
#       `acknowledge` phase below cannot be driven at all, and the cool-down it starts never begins.
#       Acknowledgement is a user action in Pulse's own UI; nothing Conductor can reach drives it.
#   (2) MIS-AIMED INSTRUMENT. `CountAtLeast` grades against `evidence_count`, summed from
#       `retrieve_telemetry_slice.span_refs`, and Pulse's incident producer writes `span_ids: Vec::new()`.
#       Observed is always "0" whatever the cool-down did — the check could never have passed, and its
#       failure would have said nothing about P-023.
#   (3) NO STIMULUS. The five phases below declare no `[phases.emission]` table at all, and the spec
#       default is ONE PLAIN TRACE per phase — so this scenario emits five OK spans over ~6 minutes and
#       forms no incident of any kind. The phases were authored as drive documentation for an Epoch-8
#       driver that would realize them from the phase names; that driver reads emission data, not names.
# The phases are KEPT VERBATIM as the record of the intended drive shape (the connection-family
# precedent), and P-023 stays classified Auto with this scenario naming it, so the coverage gates keep
# asserting the gap rather than letting it be forgotten. Closing it needs a Pulse-side ack surface —
# recorded as SUT intake, not as work this chunk can do.
name = "ack-cooldown"
p_ids = ["P-023"]
seed = 4317023
slo_tier = "<20s"   # the incident surfacing tier; the 5-min cool-down is phase timing, not the SLO budget
jitter_ms = 50

[[phases]]
name = "trigger-incident"   # establish an active incident of a given kind-and-scope
gap_ms = 4000

[[phases]]
name = "acknowledge"   # the user acknowledges the incident -> starts the 5-min cool-down (no drivable tool: see (1))
gap_ms = 2000

[[phases]]
name = "retrigger-within-cooldown"   # re-emit the SAME kind WITHIN 5min -> no new active incident, corpus-only
gap_ms = 60000

[[phases]]
name = "wait-past-cooldown"   # let the 5-min cool-down window elapse
gap_ms = 300000

[[phases]]
name = "retrigger-after-cooldown"   # re-emit AFTER the window -> a NEW incident forms
gap_ms = 4000
