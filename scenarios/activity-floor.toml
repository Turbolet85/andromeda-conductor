# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-013 — Service Activity Floor Learning (pulse-capability-spec.md §P-013).
# Pulse learns a per-service activity histogram and SUPPRESSES ServiceWentSilent when the current
# quiet falls within the learned normal pattern. Recipe: train a bursty cadence (active 5min /
# quiet 10min, repeating), then a 30-min developer-on-lunch quiet must raise NO ServiceWentSilent.
# The bursty cadence is the conductor-faults bursty-train-pattern lever, applied by the Epoch-8
# driver from the phase names (this config only times + labels the phases — it binds nothing).
# Cold-start: ServiceWentSilent is universally suppressed for the first 60min/service while the
# histogram bootstraps; the durations here are representative — the Epoch-8 live run owns the
# spec-faithful convergence (and any compression of the ~90-min total).
# OUT of scope: the spec's "restart Pulse mid-training, verify histogram restoration" leg —
# Conductor does not manage the Pulse process.
# Coverage mode: drive+observe — the no-false-silent guard is auto (MCP read-back absence); the
# constellation dot is operator-checklist.
#
# DECLARE-ONLY (2026-09-15-remaining-structurally-dead-declarations-retired) — the
# `Absent "ServiceWentSilent"` check was retired. Measured at SUT HEAD `83d4060`:
#   (1) THE TOKEN IS NEVER RENDERED. `crates/triage/src/contract.rs:181` declares
#       `#[serde(rename_all = "snake_case")]` on `CueKind`, so every serialized render emits
#       `service_went_silent`. The PascalCase spelling exists only as a Rust identifier.
#   (2) THE CHECK PASSED VACUOUSLY. An `Absent` of a token no producer can emit is true in every
#       world, so it graded nothing. This is the more dangerous half of the class (test-plan §6):
#       a permanent FAIL announces itself, a vacuous PASS never does.
# P-013's real claim — that Pulse SUPPRESSES the silence cue during a learned quiet — is untouched
# and remains undriven: it needs a read-back surface carrying the cue kind, and none does under
# deterministic L4. Correcting the token to `service_went_silent` is DELIBERATELY not done here; it
# would make the check reachable, not proven, and could hard-Fail a live run on an unproven premise.
name = "activity-floor"
p_ids = ["P-013"]
seed = 4317013
slo_tier = "<90s"   # a long-window scenario; the lunch is a non-event (no positive-event latency)
jitter_ms = 50

[[phases]]
name = "train-active-1"
gap_ms = 300000   # 5min active burst
[phases.emission]
kind = "plain"
occurrences = 60   # one every ~5s across the burst

[[phases]]
name = "train-quiet-1"
gap_ms = 600000   # 10min quiet
[phases.emission]
kind = "plain"
occurrences = 0

[[phases]]
name = "train-active-2"
gap_ms = 300000
[phases.emission]
kind = "plain"
occurrences = 60

[[phases]]
name = "train-quiet-2"
gap_ms = 600000
[phases.emission]
kind = "plain"
occurrences = 0

[[phases]]
name = "train-active-3"
gap_ms = 300000   # histogram converges on the 5/10 cadence
[phases.emission]
kind = "plain"
occurrences = 60

[[phases]]
name = "lunch"
gap_ms = 1800000   # 30min quiet — within the learned pattern, so NO ServiceWentSilent
[phases.emission]
kind = "plain"
occurrences = 0
