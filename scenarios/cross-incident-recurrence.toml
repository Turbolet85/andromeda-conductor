# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-036 — Cross-Incident Pattern Reference (pulse-capability-spec.md §P-036). Context-grounding family: the recurrence surface.
#   P-036 — when a fingerprint that was SEEN IN A PRIOR SESSION recurs, Pulse's incident Report references
#     the prior occurrence ("Previously seen"), grounding the new incident in cross-incident history. The
#     cross-run memory is Conductor's runs.db fingerprint index (arch §Run-History Persistence); the
#     reference render is Pulse's.
#   Recurrence is realized by running THIS scenario TWICE with the same seed: same seed → same fingerprint →
#     the SECOND run's read-back finds the first run's fingerprint in the cross-run index and surfaces
#     "Previously seen". Deterministic (an index lookup, not a model judgement) → Hard.
# Coverage mode: auto — the "Previously seen" reference is programmatic (runs.db cross-run fingerprint index
#   + MCP read-back).
# Epoch-8/10 calibration points: the "Previously seen" reference token was INFERRED (the spec uses prose;
#   Contains is substring-tolerant — the RetryStorm / LatencyRegression / Resolved precedent); the run-twice
#   harness that populates the cross-run index; the recurrence-reference latency.
#
# DECLARE-ONLY (2026-09-15-structurally-dead-assertion-class-retired) — the `Contains "Previously seen"`
# check was retired, and the ground is NOT the one the 2026-09-10 live round recorded. That round measured
# the check DEAD and attributed it to no producer emitting the token; re-derived at SUT HEAD 83d4060, the
# attribution is false and the measurement stands for a different reason:
#   (1) THE TOKEN IS EMITTED. `crates/interpretation/src/markdown.rs:221` pushes the literal
#       "## Previously Seen" into the serialized report, guarded on corpus matches existing.
#   (2) IT REACHES THE GRADED TEXT. `conductor-verify/src/extract.rs` pushes each incident's
#       `retrieve_report` `markdown` into `Observation.text`, so a report token is in scope for a
#       substring check — the surface was never the problem.
#   (3) THE CASE DIFFERS. Pulse emits "Previously Seen"; this file declared "Previously seen", and
#       `Contains` is case-SENSITIVE (`conductor-verify/src/slo.rs`, `observed.contains(..)`). The check
#       failed on one character.
# Correcting the case is DELIBERATELY not done here. It would make the check reachable, not proven: the
# run-twice recurrence path that populates the cross-run index has never been measured firing, so a
# corrected token could hard-Fail the next live run on an unproven premise. Retiring keeps the corpus
# honest and leaves the calibration to a chunk that can drive it. This is the inferred-token risk the
# calibration-points line above recorded from the start, landing exactly where it was predicted.
name = "cross-incident-recurrence"
p_ids = ["P-036"]
seed = 4317036
slo_tier = "<20s"   # the recurrence reference surfaces in the generated Report (a diagnostic latency)
jitter_ms = 50

[[phases]]
name = "fingerprinted-incident"   # emit a fingerprinted exception → an incident with a stable fingerprint
gap_ms = 3000
[phases.emission]
kind = "exception"
occurrences = 6   # clears Pulse's >=5-in-30s storm floor so an incident actually forms
variants = ["identical"]

[[phases]]
name = "recur-same-fingerprint"   # re-emit the same fingerprint → on the SECOND run the index says "Previously seen"
gap_ms = 3000
[phases.emission]
kind = "exception"
occurrences = 6
variants = ["identical"]
