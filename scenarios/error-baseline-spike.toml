# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-009 / P-010 — Per-Service Error Rate Baseline + Error Rate Spike Detection
# (pulse-capability-spec.md §3). Statistical-anomaly family: a baseline must converge before a
# deviation can be flagged, so this is a baseline -> spike timeline carrying both P-IDs.
#   P-009 baseline — EWMA error rate per service.name, converges within 60s; boundary is the
#     <10-span/min floor (a service under the floor is excluded from spike detection).
#   P-010 spike — short-term (30s) error rate >= 3.0x baseline with >= 30s persistence, detection
#     <2s p99. Recipe: establish baseline over 90s, ramp to 3.5x for 60s.
# The read-back checks are RETIRED TO DECLARE-ONLY (2026-08-18-error-baseline-spike-live-proof; the
# v2-11 disposition, settled per surface at SUT HEAD efabe8e) — the live assertions grade at the
# harvest tier instead: crates/conductor-run/tests/baseline_harvest.rs over Pulse's own
# `triage.cue.emit` line (kind "error_rate_spike" · priority "suggested" · magnitude >= 3.0 ·
# confidence >= 0.7 · the P-057 absolute-arm witness suppression_bypassed = true at 0.35 absolute).
# Coverage mode: drive+observe — candidate detection is auto (harvest tier); halo hue / constellation dot is operator-checklist.
name = "error-baseline-spike"
p_ids = ["P-009", "P-010"]
seed = 424242
slo_tier = "<90s"  # re-declared from <5s (2026-08-18): whole-run latency_ms spans the 150s emission
                   # window + read-back and exceeds every tier by construction; <90s is the closest
                   # honest bucket (the v2-11 precedent). Per-check latency — where P-010's <2s p99
                   # detection budget would actually be gradeable — is owned by v2-19.
jitter_ms = 50

[[phases]]
name = "baseline"
gap_ms = 90000   # 90s — converge the per-service error-rate baseline (P-009)
[phases.emission]
kind = "error"
occurrences = 60   # >= the P-009 10-span/min sample floor over 90s
error_percent = 10   # the baseline error rate the spike is measured against

[[phases]]
name = "spike"
gap_ms = 60000   # 60s at 3.5x baseline — exceeds the 30s persistence threshold (P-010)
[phases.emission]
kind = "error"
occurrences = 40
error_percent = 35   # 3.5x the 10% baseline

# DECLARE-ONLY — no [[expected]] blocks. Both prior checks were structurally ungradeable under
# deterministic L4 and are retired rather than left as a false signal:
#   CountAtLeast "10" (P-009 floor) graded the observation's evidence count, which reads
#   retrieve_telemetry_slice.span_refs = Incident.evidence_refs.span_ids — a field no producer ever
#   populates (Vec::new() at creation), so it read a permanent 0: a forever-CalibrationRegion
#   measuring nothing about the SUT's sample accounting.
#   Contains "ErrorRateSpike" (P-010 candidate) graded composed read-back text that cannot carry a
#   cue kind on any surface: an open incident's report renders the DEGRADED branch
#   (resolution_summary_text is attached only at resolution) whose content is fixture constants, and
#   no report branch renders a cue kind at all — the Contains could only hard-Fail forever.
# The sample floor is proven by cue EXISTENCE (Pulse's evaluator skips below-floor snapshots), and
# the candidate by the harvested `triage.cue.emit` line — see the header. The empty expected list
# routes this scenario to the declare-only/operator path (ManualCheck; KnownResidual under the
# degraded read-back), never a vacuous pass.
