# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-009 / P-010 — Per-Service Error Rate Baseline + Error Rate Spike Detection
# (pulse-capability-spec.md §3). Statistical-anomaly family: a baseline must converge before a
# deviation can be flagged, so this is a baseline -> spike timeline carrying both P-IDs.
#   P-009 baseline — EWMA error rate per service.name, converges within 60s; boundary is the
#     <10-span/min floor (a service under the floor is excluded from spike detection).
#   P-010 spike — short-term (30s) error rate >= 3.0x baseline with >= 30s persistence, detection
#     <2s p99. Recipe: establish baseline over 90s, ramp to 3.5x for 60s.
# Both checks class="Hard" — baseline math + threshold detection are deterministic; the model-side
# severity that consumes the cue is P-020 (a later chunk), not asserted here.
# Coverage mode: drive+observe — candidate detection is auto (MCP read-back); halo hue / constellation dot is operator-checklist.
name = "error-baseline-spike"
p_ids = ["P-009", "P-010"]
seed = 424242
slo_tier = "<5s"   # P-010 detection budget is <2s p99; the <5s tier covers it
jitter_ms = 50

[[phases]]
name = "baseline"
gap_ms = 90000   # 90s — converge the per-service error-rate baseline (P-009)

[[phases]]
name = "spike"
gap_ms = 60000   # 60s at 3.5x baseline — exceeds the 30s persistence threshold (P-010)

# P-009 — the error-rate baseline accumulated past its >=10-span/min sample-count floor. A met floor
# is a hard pass; CountAtLeast routes to the calibration region only when UNMET (verify::slo).
[[expected]]
kind = "CountAtLeast"
class = "Hard"
expected = "10"

# P-010 — the spike surfaces an ErrorRateSpike candidate (the spec-confirmed candidate type).
[[expected]]
kind = "Contains"
class = "Hard"
expected = "ErrorRateSpike"
