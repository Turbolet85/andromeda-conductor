# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-045 — Counter Derivation from Corpus (pulse-capability-spec.md §P-045). Report-surface family: the findings counter.
#   P-045 — the findings counter is DERIVED on demand from the corpus: it shows the count of unread active
#     incidents and refreshes within 1s of the next refresh event. Conductor drives a known number of unread
#     active incidents; the counter must reflect at least that many.
# The count is deterministic (count of unread/active incidents = the incidents Conductor drove), so this is a
#   Hard CountAtLeast on the read-back incident list (query_incident_list). THAT CHECK GRADES THE COUNT, NOT
#   THE TIMING — the two claims are orthogonal and the check below is untouched by the timing work.
# DELEGATED TIMING (≤1s) — measurable since SUT HEAD `f0c38f5`, graded at the HARVEST tier.
#   Pulse emits `metric.findings.counter_refresh_ms` carrying `duration_ms`, behind its own exact allowlist
#   leaf, and persists it to `{data_dir}/logs/agent-latest.jsonl.<date>`. NO MCP tool reads that stream, so
#   the bound is graded over a live-leg capture in the conductor-run harvest test — never by an
#   `[[expected]]` check, and never through `budget_ms` (which bounds the journal-relative span over this
#   scenario's WHOLE run — `read_back_observed_at − journal_emitted_at` — not a Pulse-internal duration).
#   The observable fires inside the findings re-poll (`FINDINGS_REPOLL_MS` = 1000),
#   continuously and unprompted — no operator action, only a running Pulse with its window open.
#   Measured 2026-08-21 (correcting the pre-leg prediction that it would land `Blocked`): its live leg
#   landed `verdict = CalibrationRegion` / `state = KnownResidual`. Two mechanisms, neither of which is the
#   declare-only auto-resolve arm — the read-back SUCCEEDED but came back under `degraded_mode`
#   (deterministic L4 makes every read-back degraded), which is the pre-accepted residual route to
#   KnownResidual; and the unmet `CountAtLeast` floor routes to CalibrationRegion rather than failing,
#   because a sample floor never hard-fails. `Blocked` needs a read-back FAILURE or an empty list, which
#   this leg did not produce.
# Coverage mode: auto (MCP read-back of query_incident_list).
#
# DECLARE-ONLY (2026-09-15-structurally-dead-assertion-class-retired) — the `CountAtLeast "3"` read-back
# check was retired against a measured ground at SUT HEAD 83d4060, the same one that retired the whole
# class: `CountAtLeast` grades `evidence_count`, which conductor-verify sums from
# `retrieve_telemetry_slice.span_refs`, and Pulse maps that 1:1 from `EvidenceRefs.span_ids`
# (`crates/mcp-server/src/tools.rs:430-435`) — a vector whose ONLY non-test writer sets it empty
# (`pulse-app/src/inference_runtime.rs:871`, `span_ids: Vec::new()`). The floor therefore graded the
# evidence count, never the FINDINGS count it was authored to assert, so `0 >= 3` was false in every world
# and the CalibrationRegion landing above was structural, not a near miss. The counter-derivation claim
# needs a read-back surface that exposes the corpus count itself; none exists in the four-tool contract.
name = "findings-counter-refresh"
p_ids = ["P-045"]
seed = 4317045
slo_tier = "<20s"   # re-declared from <5s: the phases below span 6s and latency_ms is measured journal-relative
                    # across the WHOLE run, so <5s was unattainable by construction. The ≤1s counter-refresh
                    # bound above is delegated, graded at the harvest tier — not this scenario's declared tier.
jitter_ms = 50

[[phases]]
name = "incident-1"   # first unread active incident
gap_ms = 2000

[[phases]]
name = "incident-2"   # second
gap_ms = 2000

[[phases]]
name = "incident-3"   # third — the counter must derive >= 3 unread active incidents
gap_ms = 2000
