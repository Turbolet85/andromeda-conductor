# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-025 — Halo Hue Encoding (pulse-capability-spec.md §P-025). Constellation family: the hue surface.
#   P-025 — a service's halo HUE encodes its health: as the error/health state shifts, Pulse shifts the
#     halo's hue (toward burgundy under error pressure). The hue render is Pulse's; Conductor drives the
#     error-state-shaped stream that moves it. The ≤2s pipeline latency to the hue shift is matrix-delegated
#     to Conductor's emission (input.md §Coverage constellation row); the visual hue is operator-checklist.
# Coverage mode: drive+observe — there is NO programmatic read-back of a rendered hue, so this scenario
#   declares NO expected check: it DRIVES the stimulus and the operator confirms the hue shift via the
#   generated checklist (the ManualCheck / operator-checklist path — empty `expected` → verdict None →
#   Lamp::Manual).
# DELEGATED TIMING (≤2s) — graded HARD at the HARVEST tier, under the rule stated before the drive in
#   `contracts/pulse-p025-measurement-contract.md` §The grading rule.
#   Pulse emits `metric.constellation.hue_update_ms` carrying `duration_ms` + `severity_tier`, behind its own
#   exact allowlist leaf, and persists it to `{data_dir}/logs/agent-latest.jsonl.<date>`. NO MCP tool reads
#   that stream, so the bound is graded over a live-leg capture in the conductor-run harvest test — never by
#   an `[[expected]]` check, and never through `budget_ms` (which grades
#   `read_back_observed_at − journal_emitted_at`, the journal-relative span over this scenario's WHOLE run,
#   not a Pulse-internal duration — binding one to the other would be a category error).
#   WHAT THE OBSERVABLE MEANS (Pulse HEAD `226554a`, carrying the P-025 fix `e98d838`): `duration_ms` is the
#   paint instant minus `ServiceListItem.tier_effective_at_unix_nano`, the instant the service's maximum
#   incident tier last changed — the raising incident's `opened_at` on a rise, the last max-holder's
#   `resolved_at` on a fall; acknowledgement is inert. Pulse emits ONE sample per changed service, and only
#   for a change the canvas WITNESSED (a change older than the canvas mount is skipped). The effect is
#   `ConstellationCanvas.tsx:119-136`; the sample builder is `constellation-types.ts:245-276`.
#   GRADE: every hue sample in the leg window [phase-2 start, `scenario.run` close] is graded by its WORST
#   value, ≤2000ms inclusive. A breach is a hard Fail relayed to Pulse; no in-window sample is UNGRADED, never
#   met. Each rise sample is anchored to its incident's `interpretation.incident.created` line within 1000ms.
#   The fall is witnessed by Pulse's own `smoke:hue-shift` at `e98d838`. This leg's incident may also
#   auto-resolve at the storm's end while its dot is still live, and that fall is graded like any in-window
#   sample (measured 2026-09-29: rise 684.98ms, fall 430.79ms, both in-window).
#   RETIRED TERMS (the instrument at Pulse HEAD `83d4060`, recorded in the contract's §Why the present
#   observable cannot carry the bound). Term (1) SLOWEST-WINS (one maximum across the render pass) and term
#   (3) QUANTIZATION (a duration offset from the 15s lifecycle tick that stamped `last_seen`) are GONE from
#   the hue path: the retired instrument could not grade the bound, and read 35581ms / 36705ms (2026-08-21)
#   and 14525.9ms (2026-09-07). Those readings stay pinned in the harvest test as that instrument's record.
#   Term (2) HOLDS: `visibleDots` drops any service quiet longer than `LIVE_RECENCY_WINDOW_NANOS = 60s`
#   (`constellation-types.ts:27`), so a quiet service cannot be sampled, and the value is clamped at 60000ms.
# WHAT THE SUSTAINED STREAM BUYS — VISIBILITY. The phases below emit at 2 dispatches/second so the
#   `conductor` dot is listed (a service is listed only after its first 15s lifecycle tick, and the 30s
#   baseline phase precedes the storm) and stays inside `visibleDots` through the tier flip. That puts the
#   rise in the poll-bounded case — the widget refreshes its items every 1s — rather than a first sighting.
# ATTRIBUTION is temporal, not field-based: the leaf carries no service identifier (Pulse's allowlist is
#   exactly `duration_ms` + `severity_tier`, "Aggregate-only"), and `severity_tier` cannot discriminate
#   either, because a dot's tier is incident-derived and incidents form only from Autonomous cues — so this
#   scenario must reach the same band the canary does. The canary is separated by CONSTRUCTION instead:
#   preflight readiness requires an incident opened AFTER its own storm, so the canary's rise and its sample
#   land before `scenario.run` starts, and its dot leaves `visibleDots` 60s after that storm; a hidden dot is
#   never sampled. A stale remembered-tier sample (exactly 60000ms) fires only when a hidden service
#   reappears, before phase-2 start.
#   SURFACE CORRECTION (measured at Pulse HEAD, capability semantic UNCHANGED): the Halo State Pulse canvas
#   has no production render site, so the severity→hue semantic lives on the CONSTELLATION DOT
#   (`severityToHueFraction`, `pulse-app/ui/src/widget/constellation-types.ts`) and `hue_update_ms` measures
#   THAT. The canvas is mounted only by `widget/CompactWidget.tsx`.
# LEG PRECONDITIONS: the COMPACT-WIDGET window is open, and mounted BEFORE the tier flips (the witnessed-only
#   rule skips an earlier change), and left VISIBLE, not minimized (a throttled 1s poll inflates the value).
#   A dashboard-only session emits nothing.
name = "halo-hue-encoding"
p_ids = ["P-025"]
seed = 4317025
slo_tier = "<90s"   # the closest honest bucket: whole-run latency exceeds every tier by construction
jitter_ms = 50

[[phases]]
name = "healthy-baseline"   # nominal traffic: the service halo sits at its healthy hue
gap_ms = 30000
[phases.emission]
kind = "plain"
occurrences = 60   # 2/s — makes `conductor` a live dot at tier null before any incident exists

[[phases]]
name = "error-pressure"   # a sustained identical-fingerprint storm → an Autonomous cue → the tier flips
gap_ms = 150000
[phases.emission]
kind = "exception"
occurrences = 300   # 2/s for 150s — outlives the L3 digest cadence so the dot is still live at the flip
variants = ["identical"]   # one fingerprint, so occurrences aggregate past Pulse's >=10-in-60s storm floor

# Operator-checklist (drive+observe): no [[expected]] block. The hue render is verified by the operator,
# not by MCP read-back — the empty expected routes the check to ManualCheck downstream.

# Operator-checklist item — rendered as a row in the hold dialog (design-system §Surface:
# desktop-webview / Component Patterns 7). The induced half names the stream this scenario now really
# drives, so the operator grades against what actually ran. Observing this item does NOT claim P-025:
# the delegated timing bound is graded hard at the harvest tier, over Pulse's own emitted hue samples.
[[checklist]]
induced = "error-pressure phase window; this scenario drives a sustained identical-fingerprint exception stream at 2/s for 150s, which is the only error pressure the operator is grading"
observation = "hue shifted toward burgundy under error pressure?"
