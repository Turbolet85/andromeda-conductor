# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-002 — Last-Span-Ago Tracking (pulse-capability-spec.md §P-002).
# Emit spans at known intervals; the tracker reports elapsed-since-last-span within +/-1s.
# jitter is 0 so the emission intervals are an exact ground truth for the tracker comparison.
#
# DECLARE-ONLY (measured, chunk 2026-08-19-connection-lifecycle-live-proof): the tracker value
# (last_span_ago_ms) reaches no MCP read-back surface — it rides the TauRPC resolver, the broadcast
# payload and the connection.tick / connection.state.transition tracing lines — so the former Hard
# `Contains "Receiving"` check was structurally ungradeable under deterministic L4 (leg A measured
# the structural fail). The live claim grades at the harvest tier
# (crates/conductor-run/tests/connection_harvest.rs) over those lines' own last_span_ago_ms values.
name = "last-span-ago-tracking"
p_ids = ["P-002"]
seed = 4317002
slo_tier = "<20s"   # latency ≈ scenario duration; leg B2 measured 6079 ms
jitter_ms = 0

[[phases]]
name = "interval-1"
gap_ms = 2000
[phases.emission]
kind = "plain"
occurrences = 1

[[phases]]
name = "interval-2"
gap_ms = 2000
[phases.emission]
kind = "plain"
occurrences = 1

[[phases]]
name = "interval-3"
gap_ms = 2000
[phases.emission]
kind = "plain"
occurrences = 1
