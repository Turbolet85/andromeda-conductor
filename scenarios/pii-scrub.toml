# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-035 / P-047 / P-048 — Anonymized Telemetry Excerpts + PII Scrubbing at Ingestion + No Raw OTLP
# Attribute Values Stored (pulse-capability-spec.md §P-035/§P-047/§P-048). PII-scrub family: one PII-laden
# workload driven across all three carriers — span attributes + an `exception` event (spans phase) and
# log-record body + attribute (logs phase) — by the conductor-emit PiiCorpus (seeded synthetic values per
# category; per-occurrence corpus AND span identity via the dispatcher's emission_seed).
#
# DECLARE-ONLY (retired 2026-08-19, measurement recorded): NO MCP read-back surface varies with the
# emitted payload under deterministic L4, so no [[expected]] check can grade scrubbing here.
#   Source-proven at SUT HEAD efabe8e: the `spans` table stores NO attributes and `log_records` has no
#   attribute column (P-048 holds BY SCHEMA for attributes; buffer schema.rs); the scrubbed value-bearing
#   fields (exception message/stacktrace, log body, template content) live in the in-memory buffer no
#   corpus tool reads; `retrieve_telemetry_slice` projects only the incident's evidence_refs
#   (mcp-server tools.rs:422-443) and `retrieve_report` renders only L4-fixture/incident fields.
#   Measured live (run 2026-08-19T20-37-25-933, checks still intact on that leg): the four Absent
#   sentinels (`@example.com` / `sk_live_` / `Bearer ` / `password=`) passed VACUOUSLY, the Contains
#   "user.email" structure marker failed STRUCTURALLY -> verdict Fail, state KnownResidual under the
#   degraded read-back; fingerprints were the payload-invariant det-* triple. A vacuous green is not
#   evidence (the fingerprint-storm precedent), so the checks retire rather than stand.
# The live claim grades at the HARVEST tier instead (crates/conductor-run/tests/pii_harvest.rs): all
# three carriers measured ingested via Pulse's own duckdb.append lines (spans 2x2 / span_events 1x2 /
# log_records 7x2 — zero PK-collision drops), with scrub semantics byte-verified at SUT source
# (security scrubber.rs: whole-field [REDACTED:{category}] markers at persistence; 6/7 category recall —
# the bare `sk_live_` provider-key shape matches no catalog pattern, recorded as SUT-visit intake).
# The row lands ManualCheck -> KnownResidual under the degraded read-back (producer-assigned downstream).
name = "pii-scrub"
p_ids = ["P-035", "P-047", "P-048"]
seed = 4317035
slo_tier = "<5s"   # measured 4098 ms journal-relative on the 2026-08-19 leg — the tier holds
jitter_ms = 50

[[phases]]
name = "emit-pii-spans"   # PII embedded across span attributes + an exception event (P-035 / P-047)
gap_ms = 2000
[phases.emission]
kind = "pii"
occurrences = 2
categories = ["email", "jwt", "bearer", "api_key", "credit_card", "ssn", "secret_key_value"]

[[phases]]
name = "emit-pii-logs"   # the same categories across log records (P-047 / P-048 corpus storage)
gap_ms = 2000
[phases.emission]
signal = "logs"
kind = "pii"
occurrences = 2
categories = ["email", "jwt", "bearer", "api_key", "credit_card", "ssn", "secret_key_value"]
