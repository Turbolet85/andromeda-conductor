# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-027 — Service Constellation Auto-Discovery (pulse-capability-spec.md §P-027). Constellation family: the topology surface.
#   P-027 — Pulse auto-discovers services from the telemetry stream and renders each as a dot in the service
#     constellation. A newly-appearing service.name surfaces as a new dot (≤5s, matrix-delegated); dot
#     POSITIONS stay stable across a Pulse restart; the layout caps at >20 services. Conductor drives a
#     multi-service service.name topology (the conductor-emit topology.rs primitive, already built). The
#     constellation render is Pulse's — a visual/operator-checklist claim.
# Coverage mode: drive+observe — no programmatic read-back of the rendered constellation, so NO expected
#   check: DRIVE the topology, the operator confirms the dots via the checklist (the ManualCheck path —
#   empty `expected`).
# DELEGATED TIMING (≤5s) — measurable since SUT HEAD `f0c38f5`, graded at the HARVEST tier.
#   Pulse emits `metric.constellation.discovery_ms` carrying `duration_ms` + `discovered_count`, behind its
#   own exact allowlist leaf, and persists it to `{data_dir}/logs/agent-latest.jsonl.<date>`. NO MCP tool
#   reads that stream, so the bound is graded over a live-leg capture in the conductor-run harvest test —
#   never by an `[[expected]]` check, and never through `budget_ms` (which grades Conductor's own MCP
#   round-trip, not a Pulse-internal duration). The observable fires when a new service enters the stream,
#   which is exactly this scenario's second phase — no operator action, only a running Pulse with its
#   window open.
# Declare-only (operator-checklist / Epoch-8): stable dot positions ACROSS a Pulse restart (a cross-restart
#   visual-stability property Conductor does not drive); the >20-service cap layout behaviour.
name = "service-constellation-discovery"
p_ids = ["P-027"]
seed = 4317027
slo_tier = "<5s"   # a newly-appearing service.name surfaces as a dot within ≤5s (delegated) — the fast tier
jitter_ms = 50

[[phases]]
name = "two-service-topology"   # an initial multi-service trace → two constellation dots
gap_ms = 3000
[phases.emission]
kind = "topology"
occurrences = 3
services = ["checkout-api", "payments-worker"]

[[phases]]
name = "new-service-appears"   # a new service.name enters the stream → a new dot surfaces (≤5s)
gap_ms = 3000
[phases.emission]
kind = "topology"
occurrences = 3
services = ["checkout-api", "payments-worker", "ledger-sync"]   # the third dot

# Operator-checklist (drive+observe): no [[expected]] block — the constellation dots are operator-verified.
