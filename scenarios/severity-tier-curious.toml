# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-019 / P-020 / P-021 / P-060 — Three-Tier Severity (Curious) + Model Decision + Attention Cues + Tiered Priority
# (pulse-capability-spec.md §P-019 / §P-020 / §P-021 / §P-060). Severity-calibration family: the Curious tier.
#   P-019 Curious — the model considers this worth recording for pattern learning but NOT warranting
#     interruption. Model-driven (P-020).
#   P-020 — the model retains discretion to DISMISS a low-severity cue as transient noise; a dismissed cue
#     yields no user-visible incident, which is correct behaviour, not a bug.
#   P-060 Tier-3 — baseline cadence produces the ambient interpretation rhythm (<90s).
#
# DECLARE-ONLY (2026-08-21-severity-lifecycle-live-proof) — the `Contains "Curious"` read-back check was
# retired on the same two measured grounds as its two siblings: the deterministic-L4 fixture pins ONE
# severity for every incident, and no corpus tool renders a tier word (`info|warn|error|critical` only).
# The ladder grades at the cue tier over Pulse's own `priority_tier_label` lines
# (`crates/conductor-run/tests/severity_harvest.rs`).
#
# PHASE SHAPE — Curious is the RESIDUAL band, and reaching it deliberately is subtler than the other two:
# a cue only exists at all once short-EWMA >= 3x baseline, so magnitude >= 3.0 is already true of every
# cue that fires. What makes a cue Curious is therefore failing the Suggested gate's OTHER term —
# confidence >= 0.7, i.e. 70 samples. So this file keeps its sample count deliberately LOW: 20 baseline
# samples plus a 6-span spike ends near confidence 0.26, under the Suggested floor for its whole life,
# while still clearing the 10-sample minimum the evaluator needs to consider the service at all. The
# shipped shape (10 spans at 10% error) produced a single error span — below the evaluation floor, and
# too weak to raise the EWMA past the 3x fire condition, so no cue of any tier could form.
name = "severity-tier-curious"
p_ids = ["P-019", "P-020", "P-021", "P-060"]
seed = 4317021
slo_tier = "<90s"   # P-060 Tier-3: baseline cadence, ambient interpretation rhythm (<90s)
jitter_ms = 50

[[phases]]
name = "minimal-baseline"   # 20 OK samples: past the 10-sample evaluation floor, far under the 0.7 confidence gate
gap_ms = 20000
[phases.emission]
kind = "plain"
occurrences = 20

[[phases]]
name = "weak-transient-cue"   # a brief spike: the cue fires, but at confidence ~0.26 it lands Curious
gap_ms = 6000
[phases.emission]
kind = "error"
occurrences = 6
error_percent = 100   # weakness here is the low SAMPLE COUNT, not a partial error rate
