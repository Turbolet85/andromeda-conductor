# P-019 / P-020 / P-021 / P-060 — Three-Tier Severity (Suggested) + Model Decision + Attention Cues + Tiered Priority
# (pulse-capability-spec.md §P-019 / §P-020 / §P-021 / §P-060). Severity-calibration family: the Suggested tier.
#   P-019 Suggested — the model believes this likely represents a problem but with reservations (surfaces
#     quietly: counter increment, minimal halo impact). Model-driven (P-020), asserted calibration-region.
#   P-021 attention cue — a threshold detector over baseline/pattern data emits a cue (the detected
#     condition, affected scope, deviation magnitude) into the model's context; the cue has NO user surface
#     of its own and never becomes an incident by itself. Verified THROUGH P-020 (the model's surfaced
#     incident references the cue in its evidence).
#   P-060 Tier-2 — a medium-confidence cue (confidence 0.7-0.85) triggers accelerated cadence, scheduling
#     the next inference within 20s. The slo_tier below realizes Tier-2.
# A medium-confidence error-rate-spike cue is the Tier-2 input that tends to Suggested (the cue's default
# severity hint). The Epoch-8 driver realizes the cue magnitude from the phase name.
# Declare-only: the P-021 cue -> model -> incident path (cues are internal infrastructure with no surface),
# verified through the surfaced incident at Epoch-8.
# Epoch-8 calibration points: the "Suggested" tier token is inferred (Contains substring-tolerant); the
# 0.7-0.85 confidence band; the <20s Tier-2 cadence; the model-mediated surfacing.
# Coverage mode: drive+observe — the chosen tier is auto (MCP read-back, calibration-region); the quiet
# halo + counter behaviour are operator-checklist.
name = "severity-tier-suggested"
p_ids = ["P-019", "P-020", "P-021", "P-060"]
seed = 4317020
slo_tier = "<20s"   # P-060 Tier-2: a medium-confidence cue (conf 0.7-0.85) -> accelerated cadence (<20s)
jitter_ms = 50

[[phases]]
name = "medium-cue-error-rate"   # an error-rate-spike attention cue at the Suggested-hint magnitude
gap_ms = 4000

# P-019/P-020 — the model surfaces the medium-confidence cue at the Suggested tier. Calibration-region.
[[expected]]
kind = "Contains"
class = "CalibrationRegion"
expected = "Suggested"
