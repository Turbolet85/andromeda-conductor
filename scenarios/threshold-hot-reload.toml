# LOAD ENVELOPE — this scenario's total duration is asserted against the proven-good SUT bounds in
# `contracts/pulse-load-envelope.toml` (the terms and any exemption live there, never copied here).
# A run over the envelope reports ENVIRONMENT-SUSPECT, not Fail — the harness drove it, not Pulse.

# P-055 / P-056 — Configuration Hot Reload + Prospective Threshold Application (pulse-capability-spec.md
# §P-055/§P-056). Pipeline-ops family: one operator threshold hot-reload, observed two ways.
#   P-055 — an operational-parameter change (here a detection threshold) applies within 2s WITHOUT restart.
#     The <2s reload latency is an Epoch-8 measurement (the tier declares the budget; no content token) — the
#     declare-only leg.
#   P-056 — the threshold change applies PROSPECTIVELY only: no retroactive re-evaluation of the accumulated
#     pre-change baseline, so the pre-change window raises NO retroactive cue -> a Hard Absent. (The opt-in
#     backfill that WOULD re-surface it is a Pulse-side Settings action, out of scope.)
# Recipe: a baseline phase accumulates under the old threshold; the OPERATOR hot-reloads the threshold during
#   a go/no-go hold; the post-reload phase runs under the new threshold. Conductor does not mutate Pulse's
#   config (scope law) — the reload is the operator action.
# `RetroactiveReeval` is the inferred no-fire token (substring-tolerant) — an Epoch-8 calibration point; it is
#   the RETROACTIVE marker (never a prospective candidate type), so it cannot collide with a legitimately
#   surfaced post-reload candidate.
# Coverage mode: auto (MCP read-back); the P-056 prospective-only leg is the auto-assertable Hard check.
#
# DECLARE-ONLY (2026-09-15-remaining-structurally-dead-declarations-retired) — the
# `Absent "RetroactiveReeval"` check was retired. Its ground is a TOKEN ABSENCE, not the
# `snake_case` serde rename that retired this class's `CueKind` members — the two are different
# mechanisms and only this one holds here. Measured at SUT HEAD `83d4060`:
#   (1) THE TOKEN EXISTS NOWHERE IN THE SUT. `git grep -c --fixed-strings 'RetroactiveReeval'
#       -- '*.rs'` exits 1 (no matches) across the whole Pulse tree, and there is no
#       `retroactive_reeval` sibling — so unlike `ServiceWentSilent` this is not a spelling that
#       renders differently, it is a name no producer has ever carried.
#   (2) THE CHECK PASSED VACUOUSLY — an `Absent` of a token that cannot be emitted is true in
#       every world (the more dangerous half per test-plan §6).
#   (3) THE BEHAVIOUR IT ASSERTS IS REAL. Pulse applies threshold changes forward only:
#       `crates/triage/src/lifecycle/mod.rs:57` ("next tick's evaluation, not a retroactive
#       replay") and `:103` ("next tick forward; no retroactive re-classification"). P-056 is
#       satisfied by the SUT; what is missing is a read-back token that witnesses it.
# This is the inferred-token risk the calibration-points line above recorded from the start,
# landing exactly where it was predicted. No replacement token is invented here: the absence would
# have to be asserted against a surface that could carry its presence, and none does.
name = "threshold-hot-reload"
p_ids = ["P-055", "P-056"]
seed = 4317055
slo_tier = "<20s"   # re-declared from <5s: the phases below span 6s and latency_ms is measured journal-relative
                    # across the WHOLE run, so <5s was unattainable by construction. Pulse's own <2s hot-reload
                    # budget is a delegated bound, graded at the harvest tier — not this scenario's declared tier.
jitter_ms = 50

[[phases]]
name = "pre-reload-baseline"   # traffic accumulates under the OLD threshold (the pre-change baseline)
gap_ms = 3000

[[phases]]
name = "post-reload"   # operator hot-reloaded the threshold (<2s, no restart); new threshold applies forward
gap_ms = 3000
